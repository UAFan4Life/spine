    const posterSrc = m.posterData || m.posterUrl || '';
    const posterBlock = posterSrc
      ? `<img class="detail-poster" src="${escapeHtml(posterSrc)}" alt="">`
      : `<div class="detail-poster-placeholder">${escapeHtml(letter)}</div>`;

    const yearMonth = (m.year && m.releaseMonth) ? (MONTH_NAMES[m.releaseMonth-1] + ' ' + m.year) : (m.year || '');
    const infoLine = [yearMonth, m.runtime ? fmtRuntime(m.runtime) : null].filter(Boolean).join(' · ');

    let badges = '';
    if(isWishlisted(m)) badges += `<span class="rating-badge" style="color:var(--wishlist); border-color:var(--wishlist);">WISHLIST</span>`;
    if(isResearched(m)) badges += `<span class="rating-badge" style="color:var(--researched); border-color:var(--researched);">RESEARCHED</span>`;
    badges += verdictChip(m);
    if(m.contentRating) badges += `<span class="rating-badge">${escapeHtml(m.contentRating)}</span>`;
    if(m.digitalIntermediate === '4K Native'){ const c=badgeColor('4K Native'); badges += `<span class="badge quality" style="color:${c}">4K NATIVE</span>`; }
    if((m.audioFormats||[]).some(a=>/atmos/i.test(a))){ const c=badgeColor('Atmos'); badges += `<span class="badge quality" style="color:${c}">ATMOS</span>`; }
    if(m.hdrType === 'Dolby Vision'){ const c=badgeColor('Dolby Vision'); badges += `<span class="badge quality" style="color:${c}">DOLBY VISION</span>`; }

    let html = `<div class="detail-header-row">
      ${posterBlock}
      <div class="detail-header-info">

        ${m.director ? `<div class="card-year card-director">${escapeHtml(m.director)}</div>` : ''}

  $('closeDetailBtn').addEventListener('click', ()=> $('detailOverlay').classList.remove('open'));
  $('detailOverlay').addEventListener('click', e=>{ if(e.target === $('detailOverlay')) $('detailOverlay').classList.remove('open'); });
  $('detailEditBtn').addEventListener('click', ()=>{
    const btn = $('detailEditBtn');
    const id = btn.dataset.id;
    $('detailOverlay').classList.remove('open');
    if(btn.dataset.type === 'show') openShowEditModal(id); else openEditModal(id);
  });

  // ---------- TV show: box art, pills, lookup, detail ----------
  $('showPosterPickBtn').addEventListener('click', function(){ $('showPosterFile').click(); });
  $('showPosterRemoveBtn').addEventListener('click', function(){
    formShowPosterData = ''; formShowPosterUrl = ''; updateShowPosterPreview();
  });
  $('showPosterFile').addEventListener('change', function(e){
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, POSTER_MAX_W / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        formShowPosterData = canvas.toDataURL('image/jpeg', 0.82);
        formShowPosterUrl = '';
        updateShowPosterPreview();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  setupPillInput('showTagsInput', formShowTags, 'showTagsWrap');
  setupPillInput('showCollectionsInput', formShowCollections, 'showCollectionsWrap');

  // TMDB uses a different genre list for TV than for film — these ids do not overlap cleanly.
  const TMDB_TV_GENRES = {10759:'action & adventure',16:'animation',35:'comedy',80:'crime',99:'documentary',18:'drama',10751:'family',10762:'kids',9648:'mystery',10763:'news',10764:'reality',10765:'sci-fi & fantasy',10766:'soap',10767:'talk',10768:'war & politics',37:'western'};

  let showLookupTimer = null, showLookupSeq = 0, showExtrasSeq = 0;
  function hideShowLookup(){
    $('showLookupResults').classList.remove('open');
    $('showLookupResults').innerHTML = '';
    $('showLookupResults').onclick = null;
  }
  function creatorOf(d){
    return ((d && d.created_by) || []).map(function(c){ return c.name; }).filter(Boolean).join(', ');
  }
  function usTvRating(d){
    const rows = (d && d.content_ratings && d.content_ratings.results) || [];
    const us = rows.find(function(r){ return r.iso_3166_1 === 'US'; });
    return us && us.rating ? us.rating : '';
  }
  async function fetchShowExtras(tmdbId, vote){
    const seq = ++showExtrasSeq;
    formShowTmdbRating = (vote || vote === 0) ? Math.round(vote * 10) / 10 : null;
    formShowImdbRating = null; formShowImdbId = ''; formShowContentRating = '';
    if(!tmdbId) return;
    try{
      // One call: credits (creator), content_ratings (TV-MA), external_ids (imdb id for OMDb)
      const res = await fetch('https://api.themoviedb.org/3/tv/' + tmdbId + '?api_key=' + encodeURIComponent(tmdbKey()) + '&append_to_response=content_ratings,external_ids');
      const d = await res.json();
      if(seq !== showExtrasSeq) return;
      if(!$('showCreatorInput').value) $('showCreatorInput').value = creatorOf(d);
      formShowContentRating = usTvRating(d);
      formShowImdbId = (d.external_ids && d.external_ids.imdb_id) || '';
      if(d.number_of_seasons){
        $('seasonCount').textContent = (formShowSeasons.length ? '— ' + formShowSeasons.length + ' added' : '')
          + ' (TMDB lists ' + d.number_of_seasons + ')';
      }
      if(formShowImdbId && omdbKey()){
        const or = await fetch('https://www.omdbapi.com/?apikey=' + encodeURIComponent(omdbKey()) + '&i=' + encodeURIComponent(formShowImdbId));
        const od = await or.json();
        if(seq !== showExtrasSeq) return;
        const iv = parseFloat(od.imdbRating);
        if(!isNaN(iv)) formShowImdbRating = iv;
      }
    }catch(e){}
  }
  async function runShowLookup(q){
    const seq = ++showLookupSeq;
    const box = $('showLookupResults');
    if(!tmdbKey()){
      box.innerHTML = '<button type="button" class="lookup-item" id="showLookupKeyHint"><span>🔑 TV lookup needs a free TMDB key — tap to add yours</span></button>';
      box.onclick = null;
      box.classList.add('open');
      $('showLookupKeyHint').addEventListener('click', function(){ hideShowLookup(); promptTmdbKey(); });
      return;
    }
    await pagedLookup(box, {
      isCurrent: function(){ return seq === showLookupSeq; },
      onEmpty: hideShowLookup,
      fetchPage: async function(page){
        const res = await fetch('https://api.themoviedb.org/3/search/tv?api_key=' + encodeURIComponent(tmdbKey()) + '&query=' + encodeURIComponent(q) + '&include_adult=false&page=' + page);
        const data = await res.json();
        const items = (data.results || []).map(function(r){
          return {
            id: r.id,
            vote: (typeof r.vote_average === 'number') ? r.vote_average : null,
            title: r.name,                                   // TV uses `name`, not `title`
            year: r.first_air_date ? parseInt(r.first_air_date.slice(0,4)) : null,
            genres: (r.genre_ids || []).slice(0,5).map(function(id){ return TMDB_TV_GENRES[id]; }).filter(Boolean),
            thumb: r.poster_path ? 'https://image.tmdb.org/t/p/w92' + r.poster_path : '',
            poster: r.poster_path ? 'https://image.tmdb.org/t/p/w342' + r.poster_path : ''
          };
        }).filter(function(r){ return r.title; });
        return {items: items, hasMore: page < (data.total_pages || 0)};
      },
      rowHtml: function(r){
        return (r.thumb ? '<img src="' + escapeHtml(r.thumb) + '" alt="" loading="lazy">' : '') +
          '<span>' + escapeHtml(r.title) + ' <span class="li-year">' + (r.year || '') + '</span></span>';
      },
      onPick: function(r){
        $('showTitleInput').value = r.title;
        checkShowDuplicate(r.title);
        fetchShowExtras(r.id, r.vote);
        if(r.year) $('showYearInput').value = r.year;
        if(r.poster){ formShowPosterUrl = r.poster; formShowPosterData = ''; updateShowPosterPreview(); }
        let added = false;
        r.genres.forEach(function(g){ if(formShowTags.indexOf(g) === -1){ formShowTags.push(g); added = true; } });
        if(added) buildPills('showTagsWrap', formShowTags, 'showTagsInput');
        hideShowLookup();
      }
    });
  }
  $('showTitleInput').addEventListener('input', function(e){
    const q = e.target.value.trim();
    clearTimeout(showLookupTimer);
    if(q.length < 2){ hideShowLookup(); return; }
    showLookupTimer = setTimeout(function(){ runShowLookup(q); }, 150);
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('#showModalOverlay .lookup-wrap')) hideShowLookup();
  });

  // ---------- TV show detail (reuses the movie detail overlay) ----------
  function renderShowDetail(sh){
    $('detailTitle').textContent = sh.title || '';
    const letter = (sh.title||'?').charAt(0).toUpperCase();
    const posterSrc = sh.posterData || sh.posterUrl || '';
    const posterBlock = posterSrc
      ? '<img class="detail-poster" src="' + escapeHtml(posterSrc) + '" alt="">'
      : '<div class="detail-poster-placeholder">' + escapeHtml(letter) + '</div>';
    const seasons = showSeasons(sh);
    const infoLine = [sh.firstAirYear || '', seasons.length ? seasons.length + (seasons.length===1?' season':' seasons') : null].filter(Boolean).join(' · ');

    let badges = '';
    if(isWishlisted(sh)) badges += '<span class="rating-badge" style="color:var(--wishlist); border-color:var(--wishlist);">WISHLIST</span>';
    if(isResearched(sh)) badges += '<span class="rating-badge" style="color:var(--researched); border-color:var(--researched);">RESEARCHED</span>';
    if(sh.contentRating) badges += '<span class="rating-badge">' + escapeHtml(sh.contentRating) + '</span>';
    badges += verdictChip(sh);

    let html = '<div class="detail-header-row">' + posterBlock +
      '<div class="detail-header-info">' +
        '<div class="card-year">' + escapeHtml(infoLine) + '</div>' +
        (sh.creator ? '<div class="card-year card-director">' + escapeHtml(sh.creator) + '</div>' : '') +
        scoreRow(sh) +
        '<div class="detail-badges">' + badges + '</div>' +
      '</div></div>';

    html += '<div class="color-section-title">Seasons</div>';
    if(!seasons.length){
      html += '<p class="stats-empty">No seasons logged yet.</p>';
    } else {
      html += seasons.map(function(se){
        const fmts = (se.formats||[]);
        const chips = fmts.length
          ? fmts.map(function(f){ return '<span class="badge ' + FORMAT_CLASS[f.type] + '">' + escapeHtml(f.type) + (f.price ? ' $' + parseFloat(f.price).toFixed(2) : '') + '</span>'; }).join(' ')
          : '<span class="tag-pill-mini">no formats</span>';
        return '<div class="avg-price-row"><span><strong>S' + escapeHtml(String(se.num)) + '</strong> ' + chips + '</span>' +
               '<span class="avg-num">' + (se.acquiredDate ? escapeHtml(se.acquiredDate) : '—') + '</span></div>';
      }).join('');
      const total = showPriceOf(sh);
      if(isOwned(sh) && total > 0){
        html += '<div class="avg-price-row"><span><strong>Total</strong></span><span class="avg-num">$' + total.toFixed(2) + '</span></div>';
      }
    }

    if((sh.tags||[]).length){
      html += '<div class="color-section-title">Tags</div><div class="badges">' +
        sh.tags.map(function(t){ return '<span class="tag-pill-mini" style="' + tagStyle(t) + '">' + escapeHtml(t) + '</span>'; }).join('') + '</div>';
    }
    if((sh.collections||[]).length){
      html += '<div class="color-section-title">Collections</div><div class="badges">' +
        sh.collections.map(function(c){ return '<span class="tag-pill-mini" style="' + collectionStyle(c) + '">' + escapeHtml(c) + '</span>'; }).join('') + '</div>';
    }
    if(sh.notes){
      html += '<div class="color-section-title">Notes</div><p class="detail-notes">' + escapeHtml(sh.notes) + '</p>';
    }
    $('detailContent').innerHTML = html;
  }
  function openShowDetailModal(id){
    const sh = shows.find(function(x){ return x.id===id; });
    if(!sh) return;
    renderShowDetail(sh);
    $('detailEditBtn').dataset.id = id;
    $('detailEditBtn').dataset.type = 'show';
    $('detailOverlay').classList.add('open');
  }

  // ---------- TV stats dashboard ----------
  function renderShowStatsDashboard(){
    const owned = shows.filter(isOwned);
    const seasonTotal = owned.reduce(function(s,sh){ return s + showSeasons(sh).length; }, 0);
    const spent = owned.reduce(function(s,sh){ return s + showPriceOf(sh); }, 0);
    let html = '<div class="stat-hero"><div class="hero-num">$' + spent.toFixed(2) + '</div>' +
      '<div class="hero-label">across ' + owned.length + (owned.length===1?' show':' shows') + ' and ' + seasonTotal + (seasonTotal===1?' season':' seasons') + '</div></div>';

    html += '<div class="color-section-title">Seasons by format</div>';
    const counts = {};
    FORMAT_TYPES.forEach(function(t){ counts[t] = 0; });
    owned.forEach(function(sh){ showSeasons(sh).forEach(function(se){ (se.formats||[]).forEach(function(f){ if(counts.hasOwnProperty(f.type)) counts[f.type]++; }); }); });
    html += FORMAT_TYPES.map(function(t){
      return '<div class="avg-price-row"><span class="badge ' + FORMAT_CLASS[t] + '">' + escapeHtml(t) + '</span><span class="avg-num">' + counts[t] + '</span></div>';
    }).join('');

    const most = owned.slice().sort(function(a,b){ return showSeasons(b).length - showSeasons(a).length; }).slice(0,5);
    if(most.length){
      html += '<div class="color-section-title">Deepest shelves</div>';
      html += most.map(function(sh){
        const n = showSeasons(sh).length;
        return '<div class="avg-price-row"><span>' + escapeHtml(sh.title) + '</span><span class="avg-num">' + n + (n===1?' season':' seasons') + '</span></div>';
      }).join('');
    }
    $('statsContent').innerHTML = html;
  }

  // ---------- Book detail ----------
  function renderBookDetail(b){
    $('bookDetailTitle').textContent = b.title || '';
    const letter = (b.title||'?').charAt(0).toUpperCase();
    const posterSrc = b.posterData || b.posterUrl || '';
    const posterBlock = posterSrc
      ? `<img class="detail-poster" src="${escapeHtml(posterSrc)}" alt="">`
      : `<div class="detail-poster-placeholder">${escapeHtml(letter)}</div>`;
    const infoLine = [b.publishYear || '', b.pageCount ? b.pageCount + ' pages' : null].filter(Boolean).join(' · ');

    let badges = '';
    if(isWishlisted(b)) badges += `<span class="rating-badge" style="color:var(--wishlist); border-color:var(--wishlist);">WISHLIST</span>`;
    if(isResearched(b)) badges += `<span class="rating-badge" style="color:var(--researched); border-color:var(--researched);">RESEARCHED</span>`;
    if(b.readStatus) badges += `<span class="rating-badge">${escapeHtml(READ_STATUS_LABEL[b.readStatus]||b.readStatus)}</span>`;

    let html = `<div class="detail-header-row">
      ${posterBlock}
      <div class="detail-header-info">
        ${b.author ? `<div class="card-year">${escapeHtml(b.author)}</div>` : ''}
        <div class="card-year">${escapeHtml(infoLine)}</div>
        ${bookScoreRow(b)}
        <div class="detail-badges">${badges}</div>
      </div>
    </div>`;

    if(!isOwned(b) && b.amazonPrice){
      html += '<div class="color-section-title">Amazon Price</div>';
      html += `<div class="avg-price-row"><span>Last checked</span><span class="avg-num">$${b.amazonPrice.toFixed(2)}</span></div>`;
    }

    html += '<div class="color-section-title">Formats Owned</div>';
    const formats = b.formats || [];
    if(!formats.length){
      html += '<p class="stats-empty">Not marked as owned in any format.</p>';
    } else {
      html += formats.map(f=>`
        <div class="avg-price-row"><span class="badge ${BOOK_FORMAT_CLASS[f.type]}">${escapeHtml(f.type)}</span><span class="avg-num">${f.price ? '$'+parseFloat(f.price).toFixed(2) : '—'}</span></div>
      `).join('');
    }

    if(b.isbn){
      html += '<div class="color-section-title">ISBN</div>';
      html += `<p class="stats-empty" style="margin:0;">${escapeHtml(b.isbn)}</p>`;
    }

    if(b.rating){
      html += '<div class="color-section-title">Your Rating</div>';
      const stars = [1,2,3,4,5].map(i => `<span class="star-static ${i<=(b.rating||0)?'filled':''}">★</span>`).join('');
      html += `<div class="stars-row">${stars}</div>`;
    }

    if((b.tags||[]).length){
      html += '<div class="color-section-title">Genre</div>';
      html += '<div class="detail-pills">' + b.tags.map(t=>`<span class="tag-pill-mini" style="${tagStyle(t)}">${escapeHtml(t)}</span>`).join('') + '</div>';
    }

    if((b.collections||[]).length){
      html += '<div class="color-section-title">Series</div>';
      html += '<div class="detail-pills">' + b.collections.map(c=>`<span class="tag-pill-mini" style="${collectionStyle(c)}">${escapeHtml(c)}</span>`).join('') + '</div>';
    }

    if(b.notes){
      html += '<div class="color-section-title">Notes</div>';
      html += `<div class="detail-notes">${escapeHtml(b.notes)}</div>`;
    }

    if(b.acquiredDate){
      html += '<div class="color-section-title">Acquired</div>';
      html += `<p class="stats-empty" style="margin:0;">${escapeHtml(b.acquiredDate)}</p>`;
    }

    $('bookDetailContent').innerHTML = html;
  }
  function openBookDetailModal(id){
    const b = books.find(x=>x.id===id);
    if(!b) return;
    renderBookDetail(b);
    $('bookDetailEditBtn').dataset.id = id;
    $('bookDetailOverlay').classList.add('open');
  }
  $('bookDetailCloseBtn').addEventListener('click', ()=> $('bookDetailOverlay').classList.remove('open'));
  $('closeBookDetailBtn').addEventListener('click', ()=> $('bookDetailOverlay').classList.remove('open'));
  $('bookDetailOverlay').addEventListener('click', e=>{ if(e.target === $('bookDetailOverlay')) $('bookDetailOverlay').classList.remove('open'); });
  $('bookDetailEditBtn').addEventListener('click', ()=>{
    const id = $('bookDetailEditBtn').dataset.id;
    $('bookDetailOverlay').classList.remove('open');
    openBookEditModal(id);
  });

  $('authBtn').addEventListener('click', async ()=>{
    $('menuDropdown').classList.remove('open');
    if(!fbAuth) return;
    if(fbUser){ fbAuth.signOut(); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    try{
      await fbAuth.signInWithPopup(provider);
    }catch(e){
      // popups can be blocked in installed/standalone mode — fall back to full-page redirect
      try{ await fbAuth.signInWithRedirect(provider); }
      catch(e2){ showToast('Sign-in failed', true); }
    }
  });

  $('clearAllBtn').addEventListener('click', ()=>{
    $('menuDropdown').classList.remove('open');
    // Explicit table, no else-fallback: an unrecognised mode must delete NOTHING rather
    // than quietly falling through to movies.
    const TARGETS = {
      movies: {noun:'movie collection', list:()=>movies, col:()=>userCol(),  key:STORAGE_KEY,       clear:()=>{ movies = []; }, save:()=>saveMovies()},
      shows:  {noun:'TV collection',    list:()=>shows,  col:()=>showCol(),  key:SHOWS_STORAGE_KEY, clear:()=>{ shows  = []; }, save:()=>saveShows()},
      books:  {noun:'book collection',  list:()=>books,  col:()=>bookCol(),  key:BOOKS_STORAGE_KEY, clear:()=>{ books  = []; }, save:()=>saveBooks()}
    };
    const target = TARGETS[currentMode];
    if(!target){ showToast('Nothing to clear here', true); return; }
    askConfirm('Clear everything?',
      `This deletes your entire ${target.noun} ` + (cloudOn() ? 'from all synced devices.' : 'from this device.') + ' This cannot be undone.',
      async ()=>{
        if(cloudOn()){
          const ids = target.list().map(x=>x.id);
          for(let i=0; i<ids.length; i+=450){
            const batch = fbDb.batch();
            ids.slice(i, i+450).forEach(id=> batch.delete(target.col().doc(id)));
            batch.commit().catch(()=> setSyncState('error'));
          }
          localStorage.removeItem(target.key);
          return;
        }
        target.clear();
        render();
        await target.save();
      }, true);
  });

  // ---------- Cross-device sync on focus ----------
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && !$('modalOverlay').classList.contains('open') && !$('bookModalOverlay').classList.contains('open')){
      loadMovies();
      loadBooks();
    }
  });
  window.addEventListener('focus', ()=>{
    if(!$('modalOverlay').classList.contains('open') && !$('bookModalOverlay').classList.contains('open')){
      loadMovies();
      loadBooks();
    }
  });

  // ---------- Auto-hiding header (mobile) ----------
  // The CSS transform only exists under the mobile media query, so this class is
  // harmless on desktop — no need to branch on viewport width here.
  (function(){
    const header = document.querySelector('.app-header');
    if(!header) return;
    const JITTER = 6;            // px of movement to ignore, so a resting finger doesn't toggle it
    let lastY = Math.max(0, window.scrollY), hidden = false, ticking = false;

    function setHidden(v){
      if(v === hidden) return;
      hidden = v;
      document.body.classList.toggle('header-hidden', v);
    }

    function onScroll(){
      ticking = false;
      const y = Math.max(0, window.scrollY);   // clamp iOS rubber-banding
      const diff = y - lastY;
      if(y <= header.offsetHeight * 0.6){
        setHidden(false);                      // always exposed near the top
      } else if(diff > JITTER){
        setHidden(true);                       // scrolling down
      } else if(diff < -JITTER){
        setHidden(false);                      // scrolling up
      }
      if(Math.abs(diff) > JITTER) lastY = y;   // keep the baseline so slow drags still accumulate
    }

    window.addEventListener('scroll', ()=>{
      if(!ticking){ ticking = true; requestAnimationFrame(onScroll); }
    }, {passive:true});

    // If the page stops being scrollable while the header is tucked away (a filter that
    // matches little, a deletion), there'd be no scroll left to bring it back.
    if(window.ResizeObserver){
      new ResizeObserver(()=>{
        if(document.documentElement.scrollHeight - window.innerHeight < 40) setHidden(false);
      }).observe(document.body);
    }

    // Focusing search via the keyboard must not leave the field off-screen.
    document.addEventListener('focusin', e=>{ if(header.contains(e.target)) setHidden(false); });
  })();

  // ---------- Init ----------
  updateAuthUI();
  if(FIREBASE_CONFIG && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // offline cache; fails harmlessly if unsupported
    fbAuth.onAuthStateChanged(async user=>{
      if(user && user.uid !== OWNER_UID){
        fbAuth.signOut(); // fires this handler again with user = null
        showToast('This app is private', true);
        return;
      }
      fbUser = user;
      updateAuthUI();
      if(unsubMovies){ unsubMovies(); unsubMovies = null; }
      if(unsubBooks){ unsubBooks(); unsubBooks = null; }
      if(unsubShows){ unsubShows(); unsubShows = null; }
      if(user){
        setSyncState('syncing');
        await firstSyncMerge();
        await firstSyncMergeBooks();
        await firstSyncMergeShows();
        subscribeMovies();
        subscribeBooks();
        subscribeShows();
      } else {
        setSyncState('ok');
        loadMovies();
        loadBooks();
        loadShows();
      }
    });
  } else {
    loadMovies();
    loadBooks();
    loadShows();
  }
})();
</script>
