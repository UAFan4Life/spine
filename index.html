<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SPINE — Movie Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111116;
    --surface:#1b1b23;
    --surface-2:#232330;
    --border:#33333f;
    --border-soft:#2a2a34;
    --text:#eeece5;
    --text-dim:#9b98a8;
    --text-faint:#68667a;
    --accent:#d4a537;
    --accent-light:#ecc766;
    --c-4k:#2fa8a1;
    --c-bluray:#3b66e0;
    --c-dvd:#8481a0;
    --c-digital:#b463d1;
    --c-hardcover:#a87c4f;
    --c-paperback:#7a9e6e;
    --c-ebook:#4fa8d8;
    --c-audiobook:#d97a4f;
    --danger:#d9635a;
    --wishlist:#e0637a;
    --researched:#7e8fd9;
    --radius:14px;
    --radius-sm:8px;
    --font-display:'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:100px;
  }
  ::selection{background:var(--accent); color:#14141a;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent-light); outline-offset:2px;}

  /* ---------- Header ---------- */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:rgba(17,17,22,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:14px 16px 12px;
    transition:transform .26s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .header-top{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1320px; margin:0 auto; gap:12px;
  }
  .mode-toggle{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:3px; flex:0 0 auto;
  }
  .mode-btn{
    background:none; border:none; color:var(--text-dim);
    padding:6px 16px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .mode-btn.active{background:var(--accent); color:#14141a;}
  .wordmark{
    font-family:var(--font-display);
    font-size:30px;
    letter-spacing:3px;
    color:var(--text);
    display:flex; align-items:baseline; gap:8px;
  }
  .wordmark .dot{color:var(--accent);}
  .header-actions{display:flex; align-items:center; gap:10px;}
  .sync-indicator{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  }
  .sync-dot{width:6px; height:6px; border-radius:50%; background:#5fbf6f; transition:background .2s;}
  .sync-dot.syncing{background:var(--accent); animation:pulse 1s infinite;}
  .sync-dot.error{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    font-size:16px; position:relative;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--accent);}

  .menu-dropdown{
    position:absolute; top:44px; right:0; z-index:30;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); overflow:hidden; min-width:190px;
    box-shadow:0 12px 28px rgba(0,0,0,0.45);
    display:none;
  }
  .menu-dropdown.open{display:block;}
  .menu-dropdown button{
    display:block; width:100%; text-align:left; padding:11px 14px;
    background:none; border:none; color:var(--text); font-size:13.5px;
    border-bottom:1px solid var(--border-soft);
  }
  .menu-dropdown button:last-child{border-bottom:none;}
  .menu-dropdown button:hover{background:var(--surface);}
  .menu-dropdown button.danger-item{color:var(--danger);}

  .search-row{
    max-width:1320px; margin:12px auto 0; display:flex; gap:8px;
  }
  .search-input{
    flex:1;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm);
    padding:10px 14px; font-size:14.5px;
  }
  .search-input::placeholder{color:var(--text-faint);}
  .search-input:focus{border-color:var(--accent);}

  /* ---------- Stats ---------- */
  .stats-strip{
    max-width:1320px; margin:12px auto 0;
    display:flex; gap:10px; overflow-x:auto; padding-bottom:2px;
  }
  .stat-pill{
    flex:0 0 auto;
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:8px 14px;
    font-family:var(--font-mono);
  }
  .stat-pill .num{font-size:16px; font-weight:600; color:var(--accent-light);}
  .stat-pill .label{font-size:10px; color:var(--text-faint); letter-spacing:.5px; text-transform:uppercase; margin-left:6px;}

  /* ---------- Filters ---------- */
  .filter-bar{
    max-width:1320px; margin:14px auto 0; padding:0 0 4px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .segmented{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:3px;
  }
  .segmented button{
    background:none; border:none; color:var(--text-dim);
    padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .segmented button.active{background:var(--accent); color:#14141a;}
  /* ---------- Price history ---------- */
  .card-footer-right{display:flex; align-items:center; gap:4px;}
  .price-hist-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-faint);
    border-radius:6px; padding:2px 5px; line-height:0; flex:0 0 auto;
  }
  .price-hist-btn svg{width:13px; height:13px; display:block;}
  .price-hist-btn:hover{color:var(--accent-light); border-color:var(--accent);}
  .price-hist-btn.has-data{color:var(--accent); border-color:var(--accent);}

  .ph-section{
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px; margin-bottom:12px; background:var(--surface-2);
  }
  .ph-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .ph-msrp{display:flex; align-items:center; gap:6px;}
  .ph-msrp label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px;}
  .ph-msrp input{
    width:82px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:5px 8px; font-family:var(--font-mono); font-size:13px;
  }
  .ph-summary{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
  .ph-stat{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:6px;
    padding:5px 9px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);
  }
  .ph-stat b{color:var(--accent-light); font-size:13px;}
  .ph-stat.low b{color:#5fbf6f;}
  .ph-spark{width:100%; height:52px; display:block; margin:6px 0 4px;}
  .ph-obs{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;}
  .ph-obs:last-child{border-bottom:none;}
  .ph-obs .o-date{font-family:var(--font-mono); color:var(--text-faint); font-size:11.5px; flex:0 0 auto;}
  .ph-obs .o-store{flex:1; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ph-obs .o-price{font-family:var(--font-mono); color:var(--accent-light); font-weight:600;}
  .ph-obs .o-price.lowest{color:#5fbf6f;}
  .ph-obs .o-del{background:none; border:none; color:var(--text-faint); padding:2px 5px; border-radius:5px;}
  .ph-obs .o-del:hover{color:var(--danger); background:rgba(217,99,90,0.1);}
  .ph-add{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .ph-add input{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 8px; font-size:13px; min-width:0;
  }
  .ph-add .a-store{flex:2 1 110px;}
  .ph-add .a-price{flex:1 1 74px; font-family:var(--font-mono);}
  .ph-add .a-date{flex:1 1 128px;}
  .ph-add button{
    background:var(--accent); color:#14141a; border:none; border-radius:6px;
    padding:7px 13px; font-weight:700; font-size:13px; flex:0 0 auto;
  }
  .ph-empty{color:var(--text-faint); font-size:12.5px; margin:4px 0 0;}
  .ph-addkey{display:flex; gap:6px; margin-top:4px;}
  .ph-addkey select{flex:1;}

  /* ---------- Seasons editor ---------- */
  .season-block{
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px 12px; margin-bottom:10px; background:var(--surface-2);
  }
  .season-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px;}
  .season-num{display:flex; align-items:center; gap:7px; font-family:var(--font-display); font-size:19px; letter-spacing:1px;}
  .season-num input{
    width:58px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:4px 7px; font-family:var(--font-mono); font-size:14px; text-align:center;
  }
  .season-remove{
    background:none; border:none; color:var(--text-faint); font-size:15px; padding:3px 7px; border-radius:6px;
  }
  .season-remove:hover{color:var(--danger); background:rgba(217,99,90,0.1);}
  .season-acq{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .season-acq label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px;}
  .season-acq input{
    flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 9px; font-size:13px;
  }
  .season-empty{color:var(--text-faint); font-size:13px; margin:0 0 10px;}
  .add-season-btn{
    width:100%; background:var(--surface-2); border:1px dashed var(--border);
    color:var(--text-dim); border-radius:var(--radius-sm); padding:10px; font-size:13.5px; font-weight:600;
  }
  .add-season-btn:hover{border-color:var(--accent); color:var(--accent-light);}
  .season-count{font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim);}
  .status-picker{width:100%;}
  .status-picker button{flex:1; white-space:nowrap;}
  .status-picker button.active[data-status="wishlist"]{background:var(--wishlist); color:#1a1013;}
  .status-picker button.active[data-status="researched"]{background:var(--researched); color:#0f1020;}
  .chip-scroll{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    background:var(--surface); border:1px solid var(--border);
    color:var(--text-dim); padding:6px 12px; border-radius:999px;
    font-size:12.5px; font-weight:600;
  }
  .chip.active{border-color:currentColor; color:var(--accent-light); background:rgba(212,165,55,0.14);}
  .chip.fmt-4k.active{color:var(--c-4k); background:rgba(47,168,161,0.12);}
  .chip.fmt-bluray.active{color:var(--c-bluray); background:rgba(59,102,224,0.12);}
  .chip.fmt-dvd.active{color:var(--c-dvd); background:rgba(132,129,160,0.12);}
  .chip.fmt-digital.active{color:var(--c-digital); background:rgba(180,99,209,0.12);}
  .chip.fmt-hardcover.active{color:var(--c-hardcover); background:rgba(168,124,79,0.14);}
  .chip.fmt-paperback.active{color:var(--c-paperback); background:rgba(122,158,110,0.14);}
  .chip.fmt-ebook.active{color:var(--c-ebook); background:rgba(79,168,216,0.14);}
  .chip.fmt-audiobook.active{color:var(--c-audiobook); background:rgba(217,122,79,0.14);}
  .collection-bar{
    max-width:1320px; margin:10px auto 0;
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
  }
  .collection-bar:empty{display:none;}
  .collection-bar .chip{flex:0 0 auto;}
  .chip.coll.active{color:var(--accent-light); background:rgba(212,165,55,0.14); border-color:currentColor;}
  .sort-select{
    margin-left:auto;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px;
  }
  .view-toggle{
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius-sm); padding:5px 11px; font-size:15px; line-height:1;
  }
  .view-toggle:hover{color:var(--text); border-color:var(--accent);}

  /* ---------- Grid ---------- */
  .movie-grid{
    max-width:1320px; margin:18px auto 0; padding:0 16px 40px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:14px;
  }
  .movie-card{
    position:relative;
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .15s ease, border-color .15s ease;
  }
  .movie-card:hover{transform:translateY(-2px); border-color:var(--border);}
  .movie-card.owns-4k{border-color:var(--c-4k); box-shadow:0 0 0 1px var(--c-4k);}
  .movie-card:active{transform:translateY(0);}
  .card-hole{
    position:absolute; top:10px; left:10px; width:12px; height:12px;
    border-radius:50%; background:var(--bg); border:1px solid var(--border);
    z-index:2;
  }
  .wishlist-ribbon{
    position:absolute; top:10px; right:-1px; z-index:2;
    background:var(--wishlist); color:#1a1013;
    font-family:var(--font-mono); font-size:9.5px; font-weight:700;
    letter-spacing:.5px; padding:3px 10px 3px 12px;
    border-radius:6px 0 0 6px;
  }
  .poster{
    width:100%; aspect-ratio:2/3; object-fit:cover; display:block;
    background:var(--surface-2);
  }
  .poster-placeholder{
    width:100%; aspect-ratio:2/3; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    color:var(--text-faint); font-family:var(--font-display); font-size:34px; letter-spacing:2px;
  }
  .card-body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-title{
    font-family:var(--font-display); font-size:19px; letter-spacing:.5px;
    line-height:1.05; color:var(--text);
  }
  .card-year-row{display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-top:1px;}
  .card-year{font-family:var(--font-mono); font-size:12.5px; color:var(--accent-light);}
  /* Director/author can be long; keep it to one line so card heights stay even */
  .card-director{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-dim);}
  .rating-badge{
    font-family:var(--font-mono); font-size:9.5px; font-weight:700; color:var(--text-dim);
    border:1px solid var(--border-soft); border-radius:4px; padding:1px 5px; flex:0 0 auto; white-space:nowrap;
  }
  .score-block{margin-top:5px; display:flex; flex-direction:column; gap:3px;}
  .score-row{display:flex; align-items:center; gap:7px;}
  .score-src{
    font-family:var(--font-mono); font-size:10px; font-weight:600;
    color:var(--text-faint); letter-spacing:.6px; width:36px; flex:0 0 auto;
  }
  .score-stars{
    position:relative; display:inline-block; line-height:1;
    font-size:14px; letter-spacing:1px; color:var(--border);
  }
  .score-stars-fill{
    position:absolute; top:0; left:0; bottom:0; overflow:hidden; white-space:nowrap;
    color:var(--accent);
  }
  .score-num{font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--accent-light);}
  .badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px;}
  .badge{
    font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:.4px;
    padding:2.5px 6px; border-radius:4px; color:#fff;
  }
  .badge.fmt-4k{background:var(--c-4k);}
  .badge.fmt-bluray{background:var(--c-bluray);}
  .badge.fmt-dvd{background:var(--c-dvd); color:#151520;}
  .badge.fmt-digital{background:var(--c-digital);}
  .badge.fmt-hardcover{background:var(--c-hardcover);}
  .badge.fmt-paperback{background:var(--c-paperback); color:#132015;}
  .badge.fmt-ebook{background:var(--c-ebook);}
  .badge.fmt-audiobook{background:var(--c-audiobook);}
  .badge.quality{font-weight:700;}
  /* A verdict is an intention, not a disc on the shelf — outline it instead of filling it */
  .verdict-chip{background:transparent; border:1px solid currentColor; font-weight:700;}
  .verdict-chip.v-4k{color:var(--c-4k);}
  .verdict-chip.v-bluray{color:var(--c-bluray);}
  .upgrade-chip{
    font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--wishlist);
    margin-left:6px;
  }
  .stars-row{display:flex; align-items:center; gap:2px; margin-top:2px;}
  .star-static{font-size:12px; color:var(--border);}
  .star-static.filled{color:var(--accent);}
  .card-footer{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    padding-top:6px;
  }
  .price-tag{font-family:var(--font-mono); font-size:12.5px; color:var(--accent-light); font-weight:600;}
  .tag-pill-mini{
    font-size:9.5px; color:var(--text-faint); background:var(--surface-2);
    padding:2px 6px; border-radius:5px;
  }

  /* ---------- List view ---------- */
  .movie-grid.list-mode{display:flex; flex-direction:column; gap:8px;}
  .list-mode .movie-card{flex-direction:row; align-items:center; gap:12px; padding:8px 12px 8px 8px;}
  .list-mode .poster, .list-mode .poster-placeholder{
    width:44px; min-width:44px; aspect-ratio:2/3; border-radius:6px; font-size:18px;
  }
  .list-mode .card-hole{display:none;}
  /* Researched reuses the ribbon geometry so every responsive rule applies to both */
  .wishlist-ribbon.ribbon-researched{background:var(--researched); color:#0f1020;}
  .list-mode .wishlist-ribbon{top:6px; font-size:8.5px; padding:2px 8px 2px 10px;}
  .list-mode .card-body{padding:0; flex-direction:row; align-items:center; gap:12px; flex-wrap:wrap;}
  .list-mode .card-title{font-size:16.5px;}
  .list-mode .badges{margin-top:0;}
  .list-mode .stars-row{margin-top:0;}
  .list-mode .score-block{margin-top:0;}
  .list-mode .card-footer{margin-top:0; margin-left:auto; padding-top:0; gap:10px;}

  .dupe-warn{
    display:none; margin-top:6px;
    font-family:var(--font-mono); font-size:11.5px; color:var(--wishlist);
  }
  .dupe-warn.show{display:block;}

  .empty-state{
    max-width:420px; margin:60px auto; text-align:center; padding:0 20px;
    color:var(--text-dim);
  }
  .empty-state .em-title{font-family:var(--font-display); font-size:26px; letter-spacing:1px; color:var(--text); margin-bottom:6px;}
  .empty-state p{font-size:13.5px; line-height:1.5;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:20px; bottom:24px; z-index:25;
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:#14141a; border:none;
    font-size:28px; font-weight:600;
    box-shadow:0 10px 24px rgba(212,165,55,0.35);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .fab:hover{transform:scale(1.06);}
  .fab:active{transform:scale(0.96);}

  .fab-scan{
    position:fixed; right:26px; bottom:96px; z-index:25;
    width:46px; height:46px; border-radius:50%;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center;
  }
  .fab-scan:hover{border-color:var(--accent); color:var(--accent-light);}

  /* ---------- Barcode scanner ---------- */
  .scan-overlay{position:fixed; inset:0; background:#000; z-index:80; display:none; align-items:center; justify-content:center;}
  .scan-overlay.open{display:flex;}
  #scanVideo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .scan-frame{
    position:relative; width:min(80vw,420px); height:150px; z-index:1;
    border:2px solid var(--accent); border-radius:12px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,0.45);
  }
  .scan-hint{
    position:absolute; bottom:72px; left:0; right:0; text-align:center; z-index:2;
    color:#fff; font-size:14px; text-shadow:0 1px 4px #000;
  }
  .scan-close{position:absolute; top:18px; right:18px; z-index:2;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:9px 16px; border-radius:999px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:all .25s ease;
    z-index:60; font-family:var(--font-mono);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--danger); color:var(--danger);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,14,0.72);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
    backdrop-filter:blur(3px);
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--surface); width:100%; max-width:520px;
    max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0;
    border:1px solid var(--border); border-bottom:none;
    padding:20px 20px 28px;
    animation:slideUp .22s ease;
  }
  @media (min-width:640px){
    .modal-overlay{align-items:center;}
    .modal-panel{border-radius:16px; border-bottom:1px solid var(--border); margin:20px;}
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-title{font-family:var(--font-display); font-size:24px; letter-spacing:1px;}
  .form-group{margin-bottom:16px;}
  .form-group label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--text-faint); margin-bottom:6px; font-weight:600;
  }
  .form-row{display:flex; gap:10px;}
  .form-row .form-group{flex:1;}
  .lookup-wrap{position:relative;}
  .lookup-results{
    position:absolute; top:100%; left:0; right:0; z-index:5;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); display:none;
    box-shadow:0 12px 28px rgba(0,0,0,0.45);
    /* scroll inside the list; contain so flicking it doesn't scroll the modal behind */
    max-height:50vh; max-height:min(50dvh, 440px);
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  }
  .lookup-results.open{display:block;}
  .lookup-more{justify-content:center; color:var(--accent-light); font-weight:600;}
  .lookup-more:disabled{color:var(--text-faint);}
  .lookup-item{
    display:flex; gap:10px; align-items:center; width:100%;
    background:none; border:none; border-bottom:1px solid var(--border-soft);
    padding:8px 10px; color:var(--text); text-align:left; font-size:13px;
  }
  .lookup-item:last-child{border-bottom:none;}
  .lookup-item:hover{background:var(--surface);}
  .lookup-item img{width:32px; height:48px; object-fit:cover; border-radius:4px; background:var(--bg); flex:0 0 auto;}
  .lookup-item .li-year{color:var(--text-faint); font-family:var(--font-mono); font-size:11px;}
  .poster-picker{display:flex; align-items:center; gap:8px; min-height:42px;}
  .poster-picker img{width:40px; height:60px; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
  .poster-pick-btn,.poster-remove-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:12px; font-weight:600;
  }
  .poster-pick-btn:hover{color:var(--text); border-color:var(--accent);}
  .poster-remove-btn{color:var(--danger); border-color:var(--danger);}
  input[type=text],input[type=number],input[type=url],input[type=date],textarea,.field-select{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm); padding:10px 12px; font-size:14px;
  }
  input[type=date]{color-scheme:dark;}
  textarea{resize:vertical; min-height:60px;}
  input:focus,textarea:focus,.field-select:focus{border-color:var(--accent);}

  .format-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .format-option{
    display:flex; flex-direction:column; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:8px 10px; min-width:110px;
  }
  .format-toggle{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--text-dim);
  }
  .format-toggle input{accent-color:var(--accent); width:15px; height:15px;}
  .format-option.on{border-color:var(--accent);}
  .format-option.on .format-toggle{color:var(--text);}
  .format-price{display:none; width:100%;}
  .format-option.on .format-price{display:block;}
  .format-price input{padding:6px 8px; font-size:12.5px; font-family:var(--font-mono);}

  .star-picker{display:flex; gap:4px; align-items:center;}
  .star-picker button{
    background:none; border:none; font-size:26px; color:var(--border); line-height:1; padding:2px;
  }
  .star-picker button.filled{color:var(--accent);}
  .clear-rating{font-size:11px; color:var(--text-faint); background:none; border:none; margin-left:8px; text-decoration:underline;}

  .pill-input-wrap{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:8px; min-height:42px;
  }
  .pill{
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-size:12px; padding:4px 8px; border-radius:6px;
    display:flex; align-items:center; gap:6px;
  }
  .pill button{background:none; border:none; color:currentColor; opacity:.65; font-size:13px; line-height:1;}
  .pill-input-wrap input{
    border:none; background:none; flex:1; min-width:80px; padding:4px; font-size:13px;
  }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; margin-bottom:16px;
  }
  .toggle-row .toggle-label{font-size:13.5px; font-weight:600;}
  .toggle-row .toggle-sub{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .switch{position:relative; width:42px; height:24px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .track{
    position:absolute; inset:0; background:var(--border); border-radius:999px; transition:.2s;
  }
  .switch .knob{
    position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:var(--text); transition:.2s;
  }
  .switch input:checked + .track{background:var(--wishlist);}
  .switch input:checked + .track .knob{transform:translateX(18px);}
  .switch input:checked ~ .knob{transform:translateX(18px); background:#fff;}

  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:12px; border-radius:var(--radius-sm); border:none;
    font-size:14px; font-weight:700; letter-spacing:.3px;
  }
  .btn-primary{background:var(--accent); color:#14141a;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger-outline{
    background:none; border:1px solid var(--danger); color:var(--danger);
    padding:10px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
    width:100%; margin-top:10px;
  }

  .color-section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; font-weight:600;
    color:var(--text-faint); margin:18px 0 4px;
  }
  .color-section-title:first-child{margin-top:0;}
  .tag-color-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--border-soft);
  }
  .tag-color-row:last-child{border-bottom:none;}
  .tag-color-name{
    font-size:13px; padding:3px 9px; border-radius:6px;
    background:var(--surface-2); color:var(--text-dim);
  }
  .color-dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .color-dot{
    width:22px; height:22px; border-radius:50%; padding:0;
    border:2px solid transparent; font-size:10px; line-height:1; color:var(--text-faint);
  }
  .color-dot.none{background:var(--surface-2); border-color:var(--border);}
  .color-dot.selected{border-color:#fff;}
  .native-swatch{
    width:22px; height:22px; padding:0; border:2px solid var(--border); border-radius:50%;
    background:none; cursor:pointer; overflow:hidden;
  }
  .native-swatch::-webkit-color-swatch-wrapper{padding:0;}
  .native-swatch::-webkit-color-swatch{border:none; border-radius:50%;}
  .native-swatch::-moz-color-swatch{border:none; border-radius:50%;}

  /* ---------- Stats dashboard ---------- */
  .stat-hero{
    text-align:center; padding:18px 12px; margin-bottom:4px;
    background:var(--surface-2); border-radius:var(--radius-sm); border:1px solid var(--border);
  }
  .stat-hero .hero-num{font-family:var(--font-display); font-size:34px; color:var(--accent-light); letter-spacing:.5px;}
  .stat-hero .hero-label{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .donut-row{display:flex; align-items:center; gap:20px; margin:4px 0;}
  .donut{width:120px; height:120px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .donut-hole{
    width:60px; height:60px; border-radius:50%; background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim); text-align:center; line-height:1.3;
  }
  .donut-legend{display:flex; flex-direction:column; gap:6px; flex:1;}
  .donut-legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim);}
  .donut-swatch{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}
  .avg-price-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:13px;
  }
  .avg-price-row:last-child{border-bottom:none;}
  .avg-price-row .avg-num{font-family:var(--font-mono); color:var(--accent-light); font-weight:600;}
  .bar-list{display:flex; flex-direction:column; gap:8px;}
  .bar-row{display:flex; align-items:center; gap:10px;}
  .bar-row .bar-label{font-size:12px; color:var(--text-dim); width:96px; flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-row .bar-track{flex:1; background:var(--surface-2); border-radius:4px; height:16px; overflow:hidden;}
  .bar-row .bar-fill{height:100%; border-radius:4px; background:var(--accent);}
  .bar-row .bar-num{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); width:22px; text-align:right; flex:0 0 auto;}
  .month-strip{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 6px; align-items:flex-end; height:130px;}
  .month-bar-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; flex:0 0 auto; width:40px; height:100%; justify-content:flex-end;}
  .month-bar{width:22px; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px;}
  .month-bar-amt{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); white-space:nowrap;}
  .month-bar-label{font-family:var(--font-mono); font-size:9.5px; color:var(--text-dim); white-space:nowrap;}
  .stats-empty{color:var(--text-dim); font-size:13px; margin:0 0 8px;}

  /* ---------- Movie detail ---------- */
  .detail-header-row{display:flex; gap:14px; margin-bottom:6px;}
  .detail-poster{width:110px; flex:0 0 auto; aspect-ratio:2/3; object-fit:cover; border-radius:var(--radius-sm); display:block;}
  .detail-poster-placeholder{
    width:110px; flex:0 0 auto; aspect-ratio:2/3; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    color:var(--text-faint); font-family:var(--font-display); font-size:30px;
  }
  .detail-header-info{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .detail-badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px;}
  .detail-notes{
    font-size:13.5px; color:var(--text-dim); line-height:1.5; white-space:pre-wrap;
    background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px;
  }
  .detail-pills{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 4px;}

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(10,10,14,0.8); z-index:70;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px; max-width:340px; width:100%;
  }
  .confirm-box h3{margin:0 0 8px; font-family:var(--font-display); font-size:20px; letter-spacing:.5px;}
  .confirm-box p{margin:0 0 16px; font-size:13.5px; color:var(--text-dim); line-height:1.5;}
  .confirm-pin{margin:14px 0 4px;}
  .confirm-pin label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  .confirm-pin input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm); padding:10px 12px;
    font-family:var(--font-mono); font-size:18px; letter-spacing:4px; text-align:center;
  }
  .confirm-pin input:focus{border-color:var(--accent);}
  .pin-error{margin-top:6px; font-size:12px; color:var(--danger);}
  .confirm-actions{display:flex; gap:10px;}

  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}


  /* ---------- Mobile ---------- */
  @media (max-width:640px){
    /* Auto-hiding header — the class is toggled by the scroll handler further down */
    body.header-hidden .app-header{transform:translateY(-100%);}

    .app-header{padding:10px 12px;}
    .wordmark{font-size:25px; letter-spacing:2px;}
    .mode-btn{padding:5px 13px; font-size:12.5px;}
    #syncLabel{display:none;}          /* the dot already carries the state */
    .header-actions{gap:8px;}
    .search-row{margin-top:9px;}
    .search-input{padding:9px 12px; font-size:14px;}
    .stats-strip{margin-top:9px; gap:8px;}
    .stat-pill{padding:6px 11px;}
    .stat-pill .num{font-size:14px;}
    .filter-bar{margin-top:9px; gap:6px;}
    .collection-bar{margin-top:8px;}

    /* Two posters per row instead of one */
    .movie-grid{
      margin-top:12px; padding:0 10px 32px;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .card-body{padding:8px 9px 9px; gap:4px;}
    .card-title{
      font-size:15.5px; line-height:1.05;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .card-year{font-size:11px;}
    .rating-badge{font-size:8.5px; padding:1px 4px;}
    .score-block{margin-top:3px; gap:2px;}
    .score-row{gap:5px;}
    .score-src{font-size:8.5px; width:27px;}
    .score-stars{font-size:11px; letter-spacing:.5px;}
    .score-num{font-size:10.5px;}
    .badges{gap:3px;}
    .badge{font-size:8.5px; padding:2px 5px;}
    .price-tag{font-size:11.5px;}
    .tag-pill-mini{font-size:8.5px;}
    .star-static{font-size:11px;}
    .card-hole{width:9px; height:9px; top:7px; left:7px;}
    .wishlist-ribbon{top:7px; font-size:8px; padding:2px 7px 2px 9px;}
    .poster-placeholder{font-size:26px;}

    /* List view keeps its single-column flex layout; just tighten the spacing */
    .movie-grid.list-mode{gap:7px; padding:0 10px 32px;}
    .list-mode .card-title{-webkit-line-clamp:1;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="wordmark">SPINE<span class="dot">.</span></div>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-appmode="movies">Movies</button>
        <button class="mode-btn" data-appmode="shows">TV</button>
        <button class="mode-btn" data-appmode="books">Books</button>
      </div>
      <div class="header-actions">
        <div class="sync-indicator"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">synced</span></div>
        <div style="position:relative;">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">⋯</button>
          <div class="menu-dropdown" id="menuDropdown">
            <button id="authBtn" style="display:none;">👤 Sign in with Google to sync</button>
            <button id="exportBtn">⬇ Export backup (.json)</button>
            <button id="importBtn">⬆ Import backup (.json)</button>
            <button id="tmdbKeyBtn">🔑 TMDB API key</button>
            <button id="omdbKeyBtn">🎬 OMDb key (IMDb ratings)</button>
            <button id="colorsBtn">🎨 Colors</button>
            <button id="statsBtn">📊 Stats</button>
            <button id="backfillBtn">⟳ Backfill missing info</button>
            <button class="danger-item" id="clearAllBtn">✕ Clear all data</button>
          </div>
        </div>
      </div>
    </div>
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="Search title, tag, or collection…">
    </div>
    <div class="stats-strip" id="statsStrip"></div>
    <div class="filter-bar">
      <div class="segmented" id="segmented">
        <button data-mode="all" class="active">All</button>
        <button data-mode="owned">Owned</button>
        <button data-mode="wishlist">Wishlist</button>
        <button data-mode="researched">Researched</button>
      </div>
      <div class="chip-scroll" id="formatChips">
        <button class="chip fmt-4k" data-fmt="4K UHD">4K UHD</button>
        <button class="chip fmt-bluray" data-fmt="Blu-ray">Blu-ray</button>
        <button class="chip fmt-dvd" data-fmt="DVD">DVD</button>
        <button class="chip fmt-digital" data-fmt="Digital">Digital</button>
      </div>
      <div class="chip-scroll" id="showFormatChips" style="display:none;">
        <button class="chip fmt-4k" data-sfmt="4K UHD">4K UHD</button>
        <button class="chip fmt-bluray" data-sfmt="Blu-ray">Blu-ray</button>
        <button class="chip fmt-dvd" data-sfmt="DVD">DVD</button>
        <button class="chip fmt-digital" data-sfmt="Digital">Digital</button>
      </div>
      <div class="chip-scroll" id="bookFormatChips" style="display:none;">
        <button class="chip fmt-hardcover" data-bfmt="Hardcover">Hardcover</button>
        <button class="chip fmt-paperback" data-bfmt="Paperback">Paperback</button>
        <button class="chip fmt-ebook" data-bfmt="Ebook">Ebook</button>
        <button class="chip fmt-audiobook" data-bfmt="Audiobook">Audiobook</button>
      </div>
      <div class="chip-scroll" id="ratingChips"></div>
      <div class="chip-scroll" id="readStatusChips" style="display:none;">
        <button class="chip" data-rstat="unread">Unread</button>
        <button class="chip" data-rstat="reading">Reading</button>
        <button class="chip" data-rstat="read">Read</button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="recent">Recently added</option>
        <option value="title">Title A–Z</option>
        <option value="year-new">Year: newest</option>
        <option value="year-old">Year: oldest</option>
        <option value="price-high">Price: high–low</option>
        <option value="rating">Rating: high–low</option>
      </select>
      <select class="sort-select" id="acquiredMonthSelect" title="Filter by date acquired">
        <option value="">📅 All months</option>
      </select>
      <button class="view-toggle" id="viewToggle" title="List view">☰</button>
    </div>
    <div class="collection-bar" id="collectionChips"></div>
  </header>

  <main>
    <div class="movie-grid" id="movieGrid"></div>
  </main>

  <button class="fab" id="fabAdd" aria-label="Add movie">+</button>
  <button class="fab-scan" id="scanFab" aria-label="Scan barcode">SCAN</button>

  <!-- Barcode scanner -->
  <div class="scan-overlay" id="scanOverlay">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="scan-hint" id="scanHint">Point at the barcode on the back of the case</div>
    <button class="icon-btn scan-close" id="scanCloseBtn" aria-label="Close scanner">✕</button>
  </div>
  <div class="toast" id="toast"></div>
  <input type="file" id="importFile" accept="application/json" class="visually-hidden">
  <input type="file" id="posterFile" accept="image/*" class="visually-hidden">
  <input type="file" id="bookPosterFile" accept="image/*" class="visually-hidden">
  <input type="file" id="showPosterFile" accept="image/*" class="visually-hidden">

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Add Movie</div>
        <button class="icon-btn" id="closeModalBtn" aria-label="Close">✕</button>
      </div>
      <form id="movieForm">
        <div class="form-group lookup-wrap">
          <label for="titleInput">Title</label>
          <input type="text" id="titleInput" required placeholder="start typing to search…" autocomplete="off">
          <div class="lookup-results" id="lookupResults"></div>
          <div class="dupe-warn" id="dupeWarn"></div>
        </div>
        <div class="form-row">

  function escapeHtml(str){
    return (str == null ? '' : String(str)).replace(/[&<>"']/g, c => (

  // ---------- Cloud sync (Firestore) ----------
  function userCol(){ return fbDb.collection('users').doc(fbUser.uid).collection('movies'); }
  function settingsDoc(){ return fbDb.collection('users').doc(fbUser.uid).collection('meta').doc('settings'); }

  async function firstSyncMerge(){
    try{
      const snap = await userCol().get();
      const cloudIds = new Set(snap.docs.map(d=>d.id));
      const localRaw = localStorage.getItem(STORAGE_KEY);
      const local = localRaw ? JSON.parse(localRaw) : [];
      const toUpload = local.filter(m=>m && m.id && !cloudIds.has(m.id));
      for(let i=0; i<toUpload.length; i+=450){
        const batch = fbDb.batch();
        toUpload.slice(i, i+450).forEach(m=> batch.set(userCol().doc(m.id), m));
        await batch.commit();
      }
      // TMDB key: adopt the cloud copy, or seed the cloud from this device
      const sdoc = await settingsDoc().get();
      const sdata = sdoc.exists ? sdoc.data() : {};
      const cloudKey = sdata.tmdbKey || '';
      if(cloudKey && !tmdbKey()) localStorage.setItem('tmdb-api-key', cloudKey);
      else if(!cloudKey && tmdbKey()) await settingsDoc().set({tmdbKey: tmdbKey()}, {merge:true});
      const cloudOmdb = sdata.omdbKey || '';
      if(cloudOmdb && !omdbKey()) localStorage.setItem('omdb-api-key', cloudOmdb);
      else if(!cloudOmdb && omdbKey()) await settingsDoc().set({omdbKey: omdbKey()}, {merge:true});
      const cloudColors = sdata.tagColors || {};
      if(Object.keys(cloudColors).length){
        tagColors = Object.assign({}, tagColors, cloudColors);
        localStorage.setItem('tag-colors', JSON.stringify(tagColors));
      } else if(Object.keys(tagColors).length){
        await settingsDoc().set({tagColors}, {mergeFields:['tagColors']});
      }
      const cloudCollColors = sdata.collectionColors || {};
      if(Object.keys(cloudCollColors).length){
        collectionColors = Object.assign({}, collectionColors, cloudCollColors);
        localStorage.setItem('collection-colors', JSON.stringify(collectionColors));
      } else if(Object.keys(collectionColors).length){
        await settingsDoc().set({collectionColors}, {mergeFields:['collectionColors']});
      }
      const cloudBadgeColors = sdata.badgeColors || {};
      if(Object.keys(cloudBadgeColors).length){
        badgeColors = Object.assign({}, badgeColors, cloudBadgeColors);
        localStorage.setItem('badge-colors', JSON.stringify(badgeColors));
      } else if(Object.keys(badgeColors).length){
        await settingsDoc().set({badgeColors}, {mergeFields:['badgeColors']});
      }
    }catch(e){
      setSyncState('error');
    }
  }

  // A season carries its own discs and its own acquired date; everything a show-level
  // filter needs (price, formats, months) is derived from the seasons below.
  function showSeasons(sh){ return Array.isArray(sh.seasons) ? sh.seasons : []; }
  function showPriceOf(sh){
    return showSeasons(sh).reduce((sum,se)=>
      sum + (se.formats||[]).reduce((s2,f)=> s2 + (parseFloat(f.price)||0), 0), 0);
  }
  function showFormatTypes(sh){
    const set = new Set();
    showSeasons(sh).forEach(se=> (se.formats||[]).forEach(f=> set.add(f.type)));
    return [...set];
  }
  function showAcquiredMonths(sh){
    return showSeasons(sh).map(se=> (se.acquiredDate||'').slice(0,7)).filter(Boolean);

    return movies.reduce((sum,m)=>{

      return sum + (m.formats||[]).reduce((s,f)=> s + (parseFloat(f.price)||0), 0);

    return books.reduce((sum,b)=>{

  function scoreRow(m){
    const rows = [];

    if(!rows.length) return '';
    return '<div class="score-block">' + rows.map(r=>{
      const pct = Math.max(0, Math.min(100, r.score * 10));
      return `<div class="score-row">
        <span class="score-src">${r.src}</span>
        <span class="score-stars">★★★★★<span class="score-stars-fill" style="width:${pct}%">★★★★★</span></span>
        <span class="score-num">${r.score.toFixed(1)}</span>

  function getFiltered(){

    if(filterMode === 'wishlist') list = list.filter(isWishlisted);
    if(activeFormatFilters.size){
      list = list.filter(m => (m.formats||[]).some(f => activeFormatFilters.has(f.type)));
    }
    if(activeRatingFilters.size){
      list = list.filter(m => activeRatingFilters.has(m.contentRating));
    }
    if(activeCollection){
      list = list.filter(m => (m.collections||[]).includes(activeCollection));
    }
    if(activeAcquiredMonth){
      list = list.filter(m => (m.acquiredDate||'').slice(0,7) === activeAcquiredMonth);
    }
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      list = list.filter(m =>
        (m.title||'').toLowerCase().includes(q) ||
        (m.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
        (m.collections||[]).some(c=>c.toLowerCase().includes(q))
      );
    }
    switch(sortBy){
      case 'title': list.sort((a,b)=>(a.title||'').localeCompare(b.title||'')); break;
      case 'year-new': list.sort((a,b)=> (b.year||0) - (a.year||0)); break;
      case 'year-old': list.sort((a,b)=> (a.year||9999) - (b.year||9999)); break;
      case 'price-high': list.sort((a,b)=> priceOf(b) - priceOf(a)); break;
      case 'rating': list.sort((a,b)=> (b.rating||0) - (a.rating||0)); break;
      default: list.sort((a,b)=> (b.dateAdded||0) - (a.dateAdded||0));
    }
    return list;
  }

  // ---------- Stats dashboard aggregates ----------
  function upgradeTotal(){
    const targets = movies.filter(m=> m.upgradePrice && !(m.formats||[]).some(f=>f.type==='4K UHD'));
    return { total: targets.reduce((s,m)=> s + m.upgradePrice, 0), count: targets.length };
  }
  function formatAverages(){
    const sums = {}, counts = {};
    FORMAT_TYPES.forEach(t=>{ sums[t] = 0; counts[t] = 0; });
    movies.filter(isOwned).forEach(m=>{
      (m.formats||[]).forEach(f=>{
        if(sums.hasOwnProperty(f.type)){ sums[f.type] += (parseFloat(f.price)||0); counts[f.type]++; }
      });
    });
    return FORMAT_TYPES.map(t=>({ type:t, avg: counts[t] ? sums[t]/counts[t] : null, count: counts[t] }));
  }
  function topCollections(n){
    const counts = {};
    movies.forEach(m=> (m.collections||[]).forEach(c=> counts[c] = (counts[c]||0) + 1));
    return Object.entries(counts).sort((a,b)=> b[1]-a[1]).slice(0, n||10);
  }
  function monthBucket(m){
    const d = m.acquiredDate || (m.dateAdded ? new Date(m.dateAdded).toISOString().slice(0,7) : '');
    return d ? d.slice(0,7) : '';
  }
  function spendByMonth(){
    const sums = {};
    movies.filter(isOwned).forEach(m=>{
      const bucket = monthBucket(m);
      if(!bucket) return;
      sums[bucket] = (sums[bucket]||0) + priceOf(m);
    });
    return Object.entries(sums).sort((a,b)=> a[0].localeCompare(b[0]));
  }
  // Months that actually have a logged "date acquired" — newest first. Deliberately does
  // NOT fall back to dateAdded the way monthBucket does: this filter is about what you
  // recorded buying, not when the row happened to be created.
  function acquiredMonths(){
    const src = currentMode === 'books' ? books : currentMode === 'shows' ? shows : movies;
    const set = new Set();
    if(currentMode === 'shows') src.forEach(sh=> showAcquiredMonths(sh).forEach(m=> set.add(m)));
    else src.forEach(x=>{ if(x.acquiredDate) set.add(x.acquiredDate.slice(0,7)); });
    return [...set].sort((a,b)=> b.localeCompare(a));
  }
  function acquiredMonthLabel(ym){
    const [y,mo] = ym.split('-');
    return MONTH_NAMES[parseInt(mo,10)-1] + ' ' + y;
  }
  function renderAcquiredMonths(){
    const months = acquiredMonths();
    const sel = $('acquiredMonthSelect');
    if(activeAcquiredMonth && !months.includes(activeAcquiredMonth)) activeAcquiredMonth = '';
    sel.innerHTML = '<option value="">📅 All months</option>' +
      months.map(m=>`<option value="${m}">${acquiredMonthLabel(m)}</option>`).join('');
    sel.value = activeAcquiredMonth;
    sel.style.display = months.length ? '' : 'none';   // nothing logged yet = no dead control
  }
  function monthLabel(ym){
    const [y,mo] = ym.split('-');
    return MONTH_NAMES[parseInt(mo,10)-1] + " '" + y.slice(2);
  }
  function bookWishlistTotal(){
    const targets = books.filter(b=> isWishlisted(b) && b.amazonPrice);
    return { total: targets.reduce((s,b)=> s + b.amazonPrice, 0), count: targets.length };
  }
  function bookFormatAverages(){
    const sums = {}, counts = {};
    BOOK_FORMAT_TYPES.forEach(t=>{ sums[t] = 0; counts[t] = 0; });
    books.filter(isOwned).forEach(b=>{
      (b.formats||[]).forEach(f=>{
        if(sums.hasOwnProperty(f.type)){ sums[f.type] += (parseFloat(f.price)||0); counts[f.type]++; }
      });
    });
    return BOOK_FORMAT_TYPES.map(t=>({ type:t, avg: counts[t] ? sums[t]/counts[t] : null, count: counts[t] }));
  }
  function topSeries(n){
    const counts = {};
    books.forEach(b=> (b.collections||[]).forEach(c=> counts[c] = (counts[c]||0) + 1));
    return Object.entries(counts).sort((a,b)=> b[1]-a[1]).slice(0, n||10);
  }
  function bookMonthBucket(b){
    const d = b.acquiredDate || (b.dateAdded ? new Date(b.dateAdded).toISOString().slice(0,7) : '');
    return d ? d.slice(0,7) : '';
  }
  function bookSpendByMonth(){
    const sums = {};
    books.filter(isOwned).forEach(b=>{
      const bucket = bookMonthBucket(b);
      if(!bucket) return;
      sums[bucket] = (sums[bucket]||0) + bookPriceOf(b);
    });
    return Object.entries(sums).sort((a,b)=> a[0].localeCompare(b[0]));
  }

  function cardHtml(m){
    const formats = m.formats || [];

    if(m.digitalIntermediate === '4K Native'){ const c=badgeColor('4K Native'); badges += `<span class="badge quality" style="background:${c}; color:${contrastText(c)}">4K NATIVE</span>`; }
    if((m.audioFormats||[]).some(a=>/atmos/i.test(a))){ const c=badgeColor('Atmos'); badges += `<span class="badge quality" style="background:${c}; color:${contrastText(c)}">ATMOS</span>`; }
    if(m.hdrType === 'Dolby Vision'){ const c=badgeColor('Dolby Vision'); badges += `<span class="badge quality" style="background:${c}; color:${contrastText(c)}">DOLBY VISION</span>`; }
    badges += verdictChip(m);
    const stars = [1,2,3,4,5].map(i => `<span class="star-static ${i<=(m.rating||0)?'filled':''}">★</span>`).join('');
    const price = priceOf(m);

    const upgradeChip = showUpgrade ? `<span class="upgrade-chip">↑ $${m.upgradePrice.toFixed(2)}</span>` : '';

  function allContentRatings(){

      if(ib===-1) return -1;
      return ia-ib;

  function updateSuggestionLists(){
    // tags/genre and collections/series share one suggestion pool each, so typing in either

    const showTags = []; shows.forEach(sh=> (sh.tags||[]).forEach(t=> showTags.push(t)));
    const tagPool = [...new Set([...allTags(), ...allGenres(), ...showTags])].sort();
    const collPool = [...new Set([...allCollections(), ...allSeries(), ...allShowCollections()])].sort();
    const tagOptions = tagPool.map(t=>`<option value="${escapeHtml(t)}">`).join('');

  const TMDB_GENRES = {28:'action',12:'adventure',16:'animation',35:'comedy',80:'crime',99:'documentary',18:'drama',10751:'family',14:'fantasy',36:'history',27:'horror',10402:'music',9648:'mystery',10749:'romance',878:'sci-fi',10770:'tv movie',53:'thriller',10752:'war',37:'western'};

  // fetch runtime + IMDb id + US content rating from TMDB details; real IMDb rating from OMDb when a key is set
  function extractUSCertification(releaseDatesData){
    const us = (releaseDatesData.results || []).find(r=>r.iso_3166_1 === 'US');

    const dates = us.release_dates || [];
    const theatrical = dates.find(rd=>rd.type===3 && rd.certification);

  // ---------- Shared paged lookup list ----------
  // Searches used to keep only the first 6 hits, so a popular franchise could bury the exact
  // title you wanted. This shows a full page in a scrollable list and fetches further pages
  // on demand, so any result is reachable no matter how it ranks.
  //   fetchPage(page) -> Promise<{items, hasMore}>
  //   rowHtml(item)   -> inner html for one row
  //   onPick(item)    -> fill the form
  //   isCurrent()     -> false once a newer search has started
  //   onEmpty()       -> nothing found
  function pagedLookup(box, opts){
    const state = {page:0, items:[], hasMore:false, loading:false};

    function render(){
      const keepScroll = box.scrollTop;
      box.innerHTML = state.items.map(function(it, i){
        return '<button type="button" class="lookup-item" data-i="' + i + '">' + opts.rowHtml(it) + '</button>';
      }).join('') + (state.hasMore
        ? '<button type="button" class="lookup-item lookup-more" data-lookup-more><span>Show more results</span></button>'
        : '');
      box.classList.add('open');
      box.scrollTop = keepScroll;          // appending a page must not jump you back to the top
    }

    async function loadNext(){
      if(state.loading) return;
      state.loading = true;
      const more = box.querySelector('[data-lookup-more]');
      if(more){ more.disabled = true; more.firstChild.textContent = 'Loading…'; }
      let res;
      try{
        res = await opts.fetchPage(state.page + 1);
      }catch(e){
        state.loading = false;
        if(!opts.isCurrent()) return;
        if(state.items.length) render(); else opts.onEmpty();
        return;
      }
      if(!opts.isCurrent()) return;        // a newer search superseded this one
      state.page += 1;
      state.items = state.items.concat(res.items);
      state.hasMore = !!res.hasMore;
      state.loading = false;
      if(!state.items.length){ opts.onEmpty(); return; }
      render();
    }

    // Assigned (not added) so each new search replaces the previous search's handler.
    box.onclick = function(e){
      if(e.target.closest('[data-lookup-more]')){ loadNext(); return; }
      const row = e.target.closest('[data-i]');
      if(row) opts.onPick(state.items[+row.dataset.i]);
    };
    return loadNext();
  }

  // ---------- Barcode scanning ----------
  let scanStream = null, scanTimer = null, scanDecoder = null, zxingPromise = null;
  const normUpc = c => String(c || '').replace(/^0+/, '');
  const SCAN_FORMATS = ['upc_a','upc_e','ean_13','ean_8'];

  // Chrome/Edge on Android have BarcodeDetector built in — nothing to download.
  async function nativeDecoder(){
    if(!('BarcodeDetector' in window)) return null;
    try{
      const fmts = await BarcodeDetector.getSupportedFormats();
      const usable = SCAN_FORMATS.filter(f => fmts.includes(f));
      if(!usable.length) return null;
      const d = new BarcodeDetector({formats:usable});
      return { detect: v => d.detect(v) };
    }catch(e){ return null; }
  }

  // Firefox (and Safari before 17) ship no BarcodeDetector at all, which is why the
  // scan button used to disappear. Pull in ZXing only for those browsers, on first tap.
  function loadZxing(){
    if(zxingPromise) return zxingPromise;
    zxingPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
      s.onload = ()=> window.ZXing ? resolve(window.ZXing) : reject(new Error('zxing missing'));
      s.onerror = ()=> reject(new Error('zxing blocked'));
      document.head.appendChild(s);
    }).catch(e=>{ zxingPromise = null; throw e; });   // let a failed load be retried
    return zxingPromise;
  }

  async function zxingDecoder(){
    const Z = await loadZxing();
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,
      [Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader();
    reader.setHints(hints);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    return { detect(video){
      if(!video.videoWidth) return [];
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      try{
        const src = new Z.HTMLCanvasElementLuminanceSource(canvas);
        const res = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
        return res ? [{rawValue:res.getText()}] : [];
      }catch(e){
        return [];                    // NotFoundException on every frame without a barcode
      }finally{
        reader.reset();
      }
    }};
  }

  async function getDecoder(){
    if(scanDecoder) return scanDecoder;
    scanDecoder = await nativeDecoder();

    }
    return scanDecoder;
  }

  async function openScanner(){
    // The button stays visible now, so say plainly why a scan can't start.
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      const secure = window.isSecureContext;
      showToast(secure ? 'This browser cannot use the camera' : 'Camera needs an https connection', true);
      return;
    }
    $('scanOverlay').classList.add('open');
    try{
      await getDecoder();
    }catch(e){
      closeScanner();
      showToast('Scanner failed to load — check your connection', true);
      return;
    }
    $('scanHint').textContent = 'Point at the barcode on the back of the case';
    try{
      scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
      const video = $('scanVideo');
      video.srcObject = scanStream;
      await video.play();
      const tick = async ()=>{
        if(!scanStream) return;
        try{
          const codes = await scanDecoder.detect(video);
          if(codes.length && codes[0].rawValue){
            if(navigator.vibrate) navigator.vibrate(80);
            const code = codes[0].rawValue;
            closeScanner();
            if(currentMode === 'shows') showToast('Barcode lookup is not wired up for TV yet', true);
            else if(currentMode === 'books') handleBookScan(code); else handleScan(code);

        }catch(e){}
        scanTimer = setTimeout(tick, 180);
      };
      tick();
    }catch(e){
      closeScanner();
      showToast('Camera unavailable', true);
    }
  }

  // ---------- Price history ----------
  // Stored on the item as { "<key>": { msrp, obs:[{store,price,date}] } }.
  // Key is the format for movies/books; for TV it is season + format, because a show's
  // price means nothing without saying which season.
  let priceCtx = null;   // {type, id}

  function itemsOf(type){ return type === 'movie' ? movies : type === 'show' ? shows : books; }
  function colOf(type){ return type === 'movie' ? userCol() : type === 'show' ? showCol() : bookCol(); }
  function saveOf(type){ return type === 'movie' ? saveMovies() : type === 'show' ? saveShows() : saveBooks(); }
  function findItem(type, id){ return itemsOf(type).find(function(x){ return x.id === id; }); }

  function historyOf(item){
    return (item && typeof item.priceHistory === 'object' && item.priceHistory) ? item.priceHistory : {};
  }
  function hasPriceData(item){
    const h = historyOf(item);
    return Object.keys(h).some(function(k){
      return (h[k] && h[k].msrp) || (h[k] && (h[k].obs||[]).length);
    });
  }
  // Every key you could track — deliberately includes formats you do NOT own, so a
  // Blu-ray you already have can still track the 4K price you are waiting on.
  function trackableKeys(type, item){
    if(type === 'show'){
      const keys = [];
      showSeasons(item).forEach(function(se){
        FORMAT_TYPES.forEach(function(t){ keys.push('S' + se.num + '·' + t); });
      });
      return keys.length ? keys : FORMAT_TYPES.slice();
    }
    return (type === 'book' ? BOOK_FORMAT_TYPES : FORMAT_TYPES).slice();
  }
  function obsSorted(entry){
    return ((entry && entry.obs) || []).slice().sort(function(a,b){
      return String(a.date||'').localeCompare(String(b.date||''));
    });
  }
  function num(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }

  function refreshStoreSuggestions(){
    const set = new Set();
    [movies, shows, books].forEach(function(arr){
      arr.forEach(function(it){
        const h = historyOf(it);
        Object.keys(h).forEach(function(k){
          ((h[k]||{}).obs||[]).forEach(function(o){ if(o.store) set.add(o.store); });
        });
      });
    });
    $('storeSuggestions').innerHTML = [...set].sort().map(function(sname){
      return '<option value="' + escapeHtml(sname) + '">';
    }).join('');
  }

  // Compact price-over-time line with MSRP as a dashed reference.
  function sparkline(entry){
    const obs = obsSorted(entry).filter(function(o){ return num(o.price) !== null; });
    if(obs.length < 2) return '';
    const W = 300, H = 52, PAD = 6;
    const vals = obs.map(function(o){ return num(o.price); });
    const msrp = num(entry.msrp);
    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if(msrp !== null){ lo = Math.min(lo, msrp); hi = Math.max(hi, msrp); }
    if(hi === lo){ hi = lo + 1; }
    const x = function(i){ return PAD + (i * (W - PAD*2)) / (obs.length - 1); };
    const y = function(v){ return H - PAD - ((v - lo) / (hi - lo)) * (H - PAD*2); };
    const pts = vals.map(function(v,i){ return x(i) + ',' + y(v).toFixed(1); }).join(' ');
    const minV = Math.min.apply(null, vals);
    const dots = vals.map(function(v,i){
      const isLow = v === minV;
      return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="' + (isLow?3.2:2.2) +
        '" fill="' + (isLow ? '#5fbf6f' : 'var(--accent)') + '"></circle>';
    }).join('');
    const msrpLine = msrp !== null
      ? '<line x1="' + PAD + '" y1="' + y(msrp).toFixed(1) + '" x2="' + (W-PAD) + '" y2="' + y(msrp).toFixed(1) +
        '" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="4 3"></line>'
      : '';
    return '<svg class="ph-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      msrpLine +
      '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"></polyline>' +
      dots + '</svg>';
  }

  function renderPriceHistory(){
    if(!priceCtx) return;
    const item = findItem(priceCtx.type, priceCtx.id);
    if(!item){ $('priceOverlay').classList.remove('open'); return; }
    $('priceTitle').textContent = item.title || 'Price History';
    const h = historyOf(item);
    const keys = Object.keys(h);
    let html = '';
    if(!keys.length){
      html = '<p class="ph-empty">Nothing tracked yet. Pick a format below and hit Track to start logging prices.</p>';
    }
    keys.forEach(function(k){
      const entry = h[k] || {};
      const obs = obsSorted(entry);
      const vals = obs.map(function(o){ return num(o.price); }).filter(function(v){ return v !== null; });
      const msrp = num(entry.msrp);
      const latest = obs.length ? obs[obs.length-1] : null;
      const lowest = vals.length ? Math.min.apply(null, vals) : null;
      const lowObs = lowest !== null ? obs.filter(function(o){ return num(o.price) === lowest; })[0] : null;
      const offPct = (msrp !== null && lowest !== null && msrp > 0)
        ? Math.round((1 - lowest/msrp) * 100) : null;

      let summary = '';
      if(latest) summary += '<span class="ph-stat">latest <b>$' + num(latest.price).toFixed(2) + '</b></span>';
      if(lowest !== null) summary += '<span class="ph-stat low">lowest <b>$' + lowest.toFixed(2) + '</b></span>';
      if(offPct !== null) summary += '<span class="ph-stat low"><b>' + offPct + '%</b> off MSRP</span>';
      if(lowObs && lowObs.store) summary += '<span class="ph-stat">best at <b>' + escapeHtml(lowObs.store) + '</b></span>';

      html += '<div class="ph-section" data-key="' + escapeHtml(k) + '">' +
        '<div class="ph-head">' +
          '<span class="badge ' + (FORMAT_CLASS[k.split('·').pop()] || BOOK_FORMAT_CLASS[k] || '') + '">' + escapeHtml(k) + '</span>' +
          '<span class="ph-msrp"><label for="msrp_' + escapeHtml(k) + '">MSRP</label>' +
            '<input type="number" step="0.01" min="0" id="msrp_' + escapeHtml(k) + '" value="' + (entry.msrp||'') + '" placeholder="34.99" data-msrp="' + escapeHtml(k) + '"></span>' +
        '</div>' +
        (summary ? '<div class="ph-summary">' + summary + '</div>' : '') +
        sparkline(entry) +
        (obs.length ? obs.slice().reverse().map(function(o){
          const isLow = num(o.price) === lowest;
          return '<div class="ph-obs">' +
            '<span class="o-date">' + escapeHtml(o.date||'—') + '</span>' +
            '<span class="o-store">' + escapeHtml(o.store||'—') + '</span>' +
            '<span class="o-price' + (isLow?' lowest':'') + '">$' + (num(o.price)!==null?num(o.price).toFixed(2):'—') + '</span>' +
            '<button type="button" class="o-del" data-del-key="' + escapeHtml(k) + '" data-del-date="' + escapeHtml(o.date||'') + '" data-del-store="' + escapeHtml(o.store||'') + '" data-del-price="' + escapeHtml(String(o.price)) + '" aria-label="Remove">✕</button>' +
          '</div>';
        }).join('') : '<p class="ph-empty">No prices logged yet.</p>') +
        '<div class="ph-add">' +
          '<input class="a-store" type="text" placeholder="Store" list="storeSuggestions" data-add-store="' + escapeHtml(k) + '">' +
          '<input class="a-price" type="number" step="0.01" min="0" placeholder="Price" data-add-price="' + escapeHtml(k) + '">' +
          '<input class="a-date" type="date" value="' + new Date().toISOString().slice(0,10) + '" data-add-date="' + escapeHtml(k) + '">' +
          '<button type="button" data-add-btn="' + escapeHtml(k) + '">Add</button>' +
        '</div>' +
      '</div>';
    });
    $('priceContent').innerHTML = html;

    // formats not yet tracked
    const remaining = trackableKeys(priceCtx.type, item).filter(function(k){ return keys.indexOf(k) === -1; });
    const sel = $('priceAddKey');
    sel.innerHTML = remaining.map(function(k){ return '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>'; }).join('');
    sel.parentElement.style.display = remaining.length ? '' : 'none';

    $('priceContent').querySelectorAll('[data-msrp]').forEach(function(inp){
      inp.addEventListener('change', function(e){
        const k = e.target.dataset.msrp;
        mutateHistory(function(hh){ hh[k] = hh[k] || {msrp:'', obs:[]}; hh[k].msrp = e.target.value; });
      });
    });
    $('priceContent').querySelectorAll('[data-add-btn]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const k = btn.dataset.addBtn;
        const store = $('priceContent').querySelector('[data-add-store="' + CSS.escape(k) + '"]').value.trim();
        const priceEl = $('priceContent').querySelector('[data-add-price="' + CSS.escape(k) + '"]');
        const date = $('priceContent').querySelector('[data-add-date="' + CSS.escape(k) + '"]').value;
        if(num(priceEl.value) === null){ showToast('Enter a price', true); return; }
        mutateHistory(function(hh){
          hh[k] = hh[k] || {msrp:'', obs:[]};
          hh[k].obs = hh[k].obs || [];
          hh[k].obs.push({store:store, price:priceEl.value, date:date});
        });
      });
    });
    $('priceContent').querySelectorAll('[data-del-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const d = btn.dataset;
        mutateHistory(function(hh){
          const arr = (hh[d.delKey]||{}).obs || [];
          const i = arr.findIndex(function(o){
            return String(o.date||'') === d.delDate && String(o.store||'') === d.delStore && String(o.price) === d.delPrice;
          });
          if(i > -1) arr.splice(i,1);
        });
      });
    });
  }

  async function mutateHistory(fn){
    if(!priceCtx) return;
    const item = findItem(priceCtx.type, priceCtx.id);
    if(!item) return;
    const h = Object.assign({}, historyOf(item));
    Object.keys(h).forEach(function(k){ h[k] = {msrp:(h[k]||{}).msrp||'', obs:((h[k]||{}).obs||[]).slice()}; });
    fn(h);
    item.priceHistory = h;
    refreshStoreSuggestions();
    renderPriceHistory();
    if(cloudOn()){
      colOf(priceCtx.type).doc(item.id).set(item).catch(function(){ setSyncState('error'); });
    } else {
      await saveOf(priceCtx.type);
    }

  function buildPills(wrapId, arr, inputId){

  function canonicalizeValue(v, pool){
    const lower = v.toLowerCase();
    const match = pool.find(p => p.toLowerCase() === lower);
    return match || v; // reuse the existing casing if this value already exists anywhere, case-insensitively
  }
  function setupPillInput(inputId, arr, wrapId){
    const input = $(inputId);
    const isTagLike = (wrapId === 'tagsWrap' || wrapId === 'genreWrap');
    const isCollLike = (wrapId === 'collectionsWrap' || wrapId === 'seriesWrap');
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ','){
        e.preventDefault();
        let v = input.value.trim().replace(/,$/,'');
        if(v){
          if(isTagLike) v = canonicalizeValue(v, [...allTags(), ...allGenres()]);
          else if(isCollLike) v = canonicalizeValue(v, [...allCollections(), ...allSeries()]);
          if(!arr.includes(v)){ arr.push(v); buildPills(wrapId, arr, inputId); }
        }
        input.value = '';
      } else if(e.key === 'Backspace' && !input.value && arr.length){
        arr.pop(); buildPills(wrapId, arr, inputId);
      }
    });
  }

  const POSTER_MAX_W = 400;
  function updatePosterPreview(){
    const prev = $('posterPreview'), pick = $('posterPickBtn'), rem = $('posterRemoveBtn');
    const src = formPosterData || formPosterUrl;
    if(src){
      prev.src = src; prev.style.display = 'block';
      rem.style.display = 'inline-block';
      pick.textContent = 'Change';

      prev.style.display = 'none'; prev.removeAttribute('src');

    }
  }
  $('posterPickBtn').addEventListener('click', ()=> $('posterFile').click());
  $('posterRemoveBtn').addEventListener('click', ()=>{ formPosterData = ''; formPosterUrl = ''; updatePosterPreview(); });
  $('posterFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, POSTER_MAX_W / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        formPosterData = canvas.toDataURL('image/jpeg', 0.72);
        updatePosterPreview();
      };
      img.onerror = ()=> showToast('Could not read that image', true);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Guards accidental taps on a destructive action. This is a speed bump, not security:

  function closeConfirm(){

    const fn = pendingConfirm;

  async function importFreshEntries(fresh, arr, col, save){
    if(!fresh.length) return;
    if(cloudOn()){
      for(let i=0; i<fresh.length; i+=450){
        const batch = fbDb.batch();
        fresh.slice(i, i+450).forEach(x=> batch.set(col().doc(x.id), x));
        batch.commit().catch(()=> setSyncState('error'));
      }
      return;
    }
    fresh.forEach(x=> arr.push(x));
    await save();
  }
  $('importFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev=>{
      try{
        const imported = JSON.parse(ev.target.result);
        // backward-compatible: old backups are a bare array of movies; new backups are {movies, books}
        const impMovies = Array.isArray(imported) ? imported : (Array.isArray(imported.movies) ? imported.movies : []);
        const impBooks = Array.isArray(imported) ? [] : (Array.isArray(imported.books) ? imported.books : []);
        const impShows = Array.isArray(imported) ? [] : (Array.isArray(imported.shows) ? imported.shows : []);
        if(!impMovies.length && !impBooks.length && !impShows.length) throw new Error('bad format');
        const existingMovieIds = new Set(movies.map(m=>m.id));
        const existingBookIds = new Set(books.map(b=>b.id));
        const freshMovies = impMovies.filter(m=>m && m.id && !existingMovieIds.has(m.id));
        const freshBooks = impBooks.filter(b=>b && b.id && !existingBookIds.has(b.id));
        const existingShowIds = new Set(shows.map(x=>x.id));
        const freshShows = impShows.filter(x=>x && x.id && !existingShowIds.has(x.id));

  // ---------- Backfill: fetch missing runtime/ratings/posters/month/content-rating for old entries ----------
  function needsBackfill(m){
    return !m.runtime || !m.imdbId || !m.tmdbRating || !m.releaseMonth || !m.contentRating || !m.director
      || (omdbKey() && !m.imdbRating)
      || (!m.posterUrl && !m.posterData);
  }

  async function backfillOne(m){
    let changed = false;
    try{
      if(!m.runtime || !m.imdbId || !m.tmdbRating || !m.year || !m.releaseMonth || !m.contentRating || !m.director || (!m.posterUrl && !m.posterData)){
        const url = 'https://api.themoviedb.org/3/search/movie?api_key=' + encodeURIComponent(tmdbKey())
          + '&query=' + encodeURIComponent(m.title)
          + (m.year ? '&year=' + m.year : '') + '&include_adult=false';
        const res = await fetch(url);
        const data = await res.json();
        const sr = (data.results || [])[0];
        if(sr){
          if(!m.tmdbRating && typeof sr.vote_average === 'number'){ m.tmdbRating = Math.round(sr.vote_average * 10) / 10; changed = true; }
          if(!m.posterUrl && !m.posterData && sr.poster_path){ m.posterUrl = 'https://image.tmdb.org/t/p/w342' + sr.poster_path; changed = true; }
          if(!m.year && sr.release_date){ m.year = parseInt(sr.release_date.slice(0,4)); changed = true; }
          if(!m.releaseMonth && sr.release_date){ const mo = parseInt(sr.release_date.slice(5,7)); if(mo){ m.releaseMonth = mo; changed = true; } }
          if(!m.runtime || !m.imdbId || !m.contentRating || !m.director){
            const dres = await fetch('https://api.themoviedb.org/3/movie/' + sr.id + '?api_key=' + encodeURIComponent(tmdbKey()) + '&append_to_response=credits');
            const d = await dres.json();
            if(!m.runtime && d.runtime){ m.runtime = d.runtime; changed = true; }
            if(!m.imdbId && d.imdb_id){ m.imdbId = d.imdb_id; changed = true; }
            if(!m.director){ const dir = directorOf(d); if(dir){ m.director = dir; changed = true; } }
            if(!m.contentRating){
              const crres = await fetch('https://api.themoviedb.org/3/movie/' + sr.id + '/release_dates?api_key=' + encodeURIComponent(tmdbKey()));
              const cr = await crres.json();
              const rating = extractUSCertification(cr);
              if(rating){ m.contentRating = rating; changed = true; }
            }
          }
        }
      }
      if(omdbKey() && !m.imdbRating && m.imdbId){
        const or = await fetch('https://www.omdbapi.com/?apikey=' + encodeURIComponent(omdbKey()) + '&i=' + encodeURIComponent(m.imdbId));
        const od = await or.json();
        const iv = parseFloat(od.imdbRating);
        if(!isNaN(iv)){ m.imdbRating = iv; changed = true; }
      }
    }catch(e){}
    return changed;
  }

  async function backfillAll(){
    if(!tmdbKey()){ showToast('Add your TMDB key first', true); return; }
    const targets = movies.filter(needsBackfill);
    if(!targets.length){ showToast('Everything is already filled in'); return; }
    askConfirm('Backfill missing info?',
      `This looks up ${targets.length} ${targets.length === 1 ? 'entry' : 'entries'} on TMDB${omdbKey() ? ' and OMDb' : ''} to fill in missing runtime, ratings, and posters. Nothing already filled in gets overwritten.`,
      async ()=>{
        setSyncState('syncing');
        const changedList = [];
        for(let i = 0; i < targets.length; i++){
          if(await backfillOne(targets[i])) changedList.push(targets[i]);
          if((i + 1) % 5 === 0) showToast('Backfilling… ' + (i + 1) + '/' + targets.length);
        }
        if(changedList.length){
          if(cloudOn()){
            for(let i = 0; i < changedList.length; i += 450){
              const batch = fbDb.batch();
              changedList.slice(i, i + 450).forEach(m=> batch.set(userCol().doc(m.id), m));

  // ---------- Backfill for books (Open Library — no key needed) ----------
  function needsBookBackfill(b){
    return !b.pageCount || !b.publicRating || (!b.posterUrl && !b.posterData);
  }
  async function backfillBookOne(b){
    let changed = false;
    try{
      if(needsBookBackfill(b)){
        const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(b.title + (b.author ? ' ' + b.author : ''))
          + '&limit=1&fields=first_publish_year,isbn,cover_i,number_of_pages_median,ratings_average,ratings_count';
        const res = await fetch(url);
        const data = await res.json();
        const d = (data.docs || [])[0];
        if(d){
          if(!b.pageCount && d.number_of_pages_median){ b.pageCount = d.number_of_pages_median; changed = true; }
          if(!b.publicRating && typeof d.ratings_average === 'number'){ b.publicRating = d.ratings_average; b.publicRatingCount = d.ratings_count || null; changed = true; }
          if(!b.posterUrl && !b.posterData && d.cover_i){ b.posterUrl = 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg'; changed = true; }
          if(!b.publishYear && d.first_publish_year){ b.publishYear = d.first_publish_year; changed = true; }
          if(!b.isbn && (d.isbn||[]).length){ b.isbn = (d.isbn||[]).find(i=>i.length===13) || d.isbn[0]; changed = true; }
        }
      }
    }catch(e){}
    return changed;
  }

  function renderMovieDetail(m){
    $('detailTitle').textContent = m.title || '';
