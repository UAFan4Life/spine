<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SPINE — Movie Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111116;
    --surface:#1b1b23;
    --surface-2:#232330;
    --border:#33333f;
    --border-soft:#2a2a34;
    --text:#eeece5;
    --text-dim:#9b98a8;
    --text-faint:#68667a;
    --accent:#d4a537;
    --accent-light:#ecc766;
    --c-4k:#2fa8a1;
    --c-bluray:#3b66e0;
    --c-dvd:#8481a0;
    --c-digital:#b463d1;
    --c-hardcover:#a87c4f;
    --c-paperback:#7a9e6e;
    --c-ebook:#4fa8d8;
    --c-audiobook:#d97a4f;
    --danger:#d9635a;
    --wishlist:#e0637a;
    --radius:14px;
    --radius-sm:8px;
    --font-display:'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:100px;
  }
  ::selection{background:var(--accent); color:#14141a;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent-light); outline-offset:2px;}

  /* ---------- Header ---------- */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:rgba(17,17,22,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:14px 16px 12px;
  }
  .header-top{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1320px; margin:0 auto; gap:12px;
  }
  .mode-toggle{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:3px; flex:0 0 auto;
  }
  .mode-btn{
    background:none; border:none; color:var(--text-dim);
    padding:6px 16px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .mode-btn.active{background:var(--accent); color:#14141a;}
  .wordmark{
    font-family:var(--font-display);
    font-size:30px;
    letter-spacing:3px;
    color:var(--text);
    display:flex; align-items:baseline; gap:8px;
  }
  .wordmark .dot{color:var(--accent);}
  .header-actions{display:flex; align-items:center; gap:10px;}
  .sync-indicator{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  }
  .sync-dot{width:6px; height:6px; border-radius:50%; background:#5fbf6f; transition:background .2s;}
  .sync-dot.syncing{background:var(--accent); animation:pulse 1s infinite;}
  .sync-dot.error{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    font-size:16px; position:relative;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--accent);}

  .menu-dropdown{
    position:absolute; top:44px; right:0; z-index:30;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); overflow:hidden; min-width:190px;
    box-shadow:0 12px 28px rgba(0,0,0,0.45);
    display:none;
  }
  .menu-dropdown.open{display:block;}
  .menu-dropdown button{
    display:block; width:100%; text-align:left; padding:11px 14px;
    background:none; border:none; color:var(--text); font-size:13.5px;
    border-bottom:1px solid var(--border-soft);
  }
  .menu-dropdown button:last-child{border-bottom:none;}
  .menu-dropdown button:hover{background:var(--surface);}
  .menu-dropdown button.danger-item{color:var(--danger);}

  .search-row{
    max-width:1320px; margin:12px auto 0; display:flex; gap:8px;
  }
  .search-input{
    flex:1;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm);
    padding:10px 14px; font-size:14.5px;
  }
  .search-input::placeholder{color:var(--text-faint);}
  .search-input:focus{border-color:var(--accent);}

  /* ---------- Stats ---------- */
  .stats-strip{
    max-width:1320px; margin:12px auto 0;
    display:flex; gap:10px; overflow-x:auto; padding-bottom:2px;
  }
  .stat-pill{
    flex:0 0 auto;
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:8px 14px;
    font-family:var(--font-mono);
  }
  .stat-pill .num{font-size:16px; font-weight:600; color:var(--accent-light);}
  .stat-pill .label{font-size:10px; color:var(--text-faint); letter-spacing:.5px; text-transform:uppercase; margin-left:6px;}

  /* ---------- Filters ---------- */
  .filter-bar{
    max-width:1320px; margin:14px auto 0; padding:0 0 4px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .segmented{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:3px;
  }
  .segmented button{
    background:none; border:none; color:var(--text-dim);
    padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600;
  }
  .segmented button.active{background:var(--accent); color:#14141a;}
  .chip-scroll{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    background:var(--surface); border:1px solid var(--border);
    color:var(--text-dim); padding:6px 12px; border-radius:999px;
    font-size:12.5px; font-weight:600;
  }
  .chip.active{border-color:currentColor; color:var(--accent-light); background:rgba(212,165,55,0.14);}
  .chip.fmt-4k.active{color:var(--c-4k); background:rgba(47,168,161,0.12);}
  .chip.fmt-bluray.active{color:var(--c-bluray); background:rgba(59,102,224,0.12);}
  .chip.fmt-dvd.active{color:var(--c-dvd); background:rgba(132,129,160,0.12);}
  .chip.fmt-digital.active{color:var(--c-digital); background:rgba(180,99,209,0.12);}
  .chip.fmt-hardcover.active{color:var(--c-hardcover); background:rgba(168,124,79,0.14);}
  .chip.fmt-paperback.active{color:var(--c-paperback); background:rgba(122,158,110,0.14);}
  .chip.fmt-ebook.active{color:var(--c-ebook); background:rgba(79,168,216,0.14);}
  .chip.fmt-audiobook.active{color:var(--c-audiobook); background:rgba(217,122,79,0.14);}
  .collection-bar{
    max-width:1320px; margin:10px auto 0;
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
  }
  .collection-bar:empty{display:none;}
  .collection-bar .chip{flex:0 0 auto;}
  .chip.coll.active{color:var(--accent-light); background:rgba(212,165,55,0.14); border-color:currentColor;}
  .sort-select{
    margin-left:auto;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius-sm); padding:7px 10px; font-size:12.5px;
  }
  .view-toggle{
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius-sm); padding:5px 11px; font-size:15px; line-height:1;
  }
  .view-toggle:hover{color:var(--text); border-color:var(--accent);}

  /* ---------- Grid ---------- */
  .movie-grid{
    max-width:1320px; margin:18px auto 0; padding:0 16px 40px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:14px;
  }
  .movie-card{
    position:relative;
    background:var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .15s ease, border-color .15s ease;
  }
  .movie-card:hover{transform:translateY(-2px); border-color:var(--border);}
  .movie-card.owns-4k{border-color:var(--c-4k); box-shadow:0 0 0 1px var(--c-4k);}
  .movie-card:active{transform:translateY(0);}
  .card-hole{
    position:absolute; top:10px; left:10px; width:12px; height:12px;
    border-radius:50%; background:var(--bg); border:1px solid var(--border);
    z-index:2;
  }
  .wishlist-ribbon{
    position:absolute; top:10px; right:-1px; z-index:2;
    background:var(--wishlist); color:#1a1013;
    font-family:var(--font-mono); font-size:9.5px; font-weight:700;
    letter-spacing:.5px; padding:3px 10px 3px 12px;
    border-radius:6px 0 0 6px;
  }
  .poster{
    width:100%; aspect-ratio:2/3; object-fit:cover; display:block;
    background:var(--surface-2);
  }
  .poster-placeholder{
    width:100%; aspect-ratio:2/3; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    color:var(--text-faint); font-family:var(--font-display); font-size:34px; letter-spacing:2px;
  }
  .card-body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-title{
    font-family:var(--font-display); font-size:19px; letter-spacing:.5px;
    line-height:1.05; color:var(--text);
  }
  .card-year-row{display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-top:1px;}
  .card-year{font-family:var(--font-mono); font-size:12.5px; color:var(--accent-light);}
  .rating-badge{
    font-family:var(--font-mono); font-size:9.5px; font-weight:700; color:var(--text-dim);
    border:1px solid var(--border-soft); border-radius:4px; padding:1px 5px; flex:0 0 auto; white-space:nowrap;
  }
  .score-block{margin-top:5px; display:flex; flex-direction:column; gap:3px;}
  .score-row{display:flex; align-items:center; gap:7px;}
  .score-src{
    font-family:var(--font-mono); font-size:10px; font-weight:600;
    color:var(--text-faint); letter-spacing:.6px; width:36px; flex:0 0 auto;
  }
  .score-stars{
    position:relative; display:inline-block; line-height:1;
    font-size:14px; letter-spacing:1px; color:var(--border);
  }
  .score-stars-fill{
    position:absolute; top:0; left:0; bottom:0; overflow:hidden; white-space:nowrap;
    color:var(--accent);
  }
  .score-num{font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--accent-light);}
  .badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px;}
  .badge{
    font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:.4px;
    padding:2.5px 6px; border-radius:4px; color:#fff;
  }
  .badge.fmt-4k{background:var(--c-4k);}
  .badge.fmt-bluray{background:var(--c-bluray);}
  .badge.fmt-dvd{background:var(--c-dvd); color:#151520;}
  .badge.fmt-digital{background:var(--c-digital);}
  .badge.fmt-hardcover{background:var(--c-hardcover);}
  .badge.fmt-paperback{background:var(--c-paperback); color:#132015;}
  .badge.fmt-ebook{background:var(--c-ebook);}
  .badge.fmt-audiobook{background:var(--c-audiobook);}
  .badge.quality{font-weight:700;}
  .upgrade-chip{
    font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--wishlist);
    margin-left:6px;
  }
  .stars-row{display:flex; align-items:center; gap:2px; margin-top:2px;}
  .star-static{font-size:12px; color:var(--border);}
  .star-static.filled{color:var(--accent);}
  .card-footer{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    padding-top:6px;
  }
  .price-tag{font-family:var(--font-mono); font-size:12.5px; color:var(--accent-light); font-weight:600;}
  .tag-pill-mini{
    font-size:9.5px; color:var(--text-faint); background:var(--surface-2);
    padding:2px 6px; border-radius:5px;
  }

  /* ---------- List view ---------- */
  .movie-grid.list-mode{display:flex; flex-direction:column; gap:8px;}
  .list-mode .movie-card{flex-direction:row; align-items:center; gap:12px; padding:8px 12px 8px 8px;}
  .list-mode .poster, .list-mode .poster-placeholder{
    width:44px; min-width:44px; aspect-ratio:2/3; border-radius:6px; font-size:18px;
  }
  .list-mode .card-hole{display:none;}
  .list-mode .wishlist-ribbon{top:6px; font-size:8.5px; padding:2px 8px 2px 10px;}
  .list-mode .card-body{padding:0; flex-direction:row; align-items:center; gap:12px; flex-wrap:wrap;}
  .list-mode .card-title{font-size:16.5px;}
  .list-mode .badges{margin-top:0;}
  .list-mode .stars-row{margin-top:0;}
  .list-mode .score-block{margin-top:0;}
  .list-mode .card-footer{margin-top:0; margin-left:auto; padding-top:0; gap:10px;}

  .dupe-warn{
    display:none; margin-top:6px;
    font-family:var(--font-mono); font-size:11.5px; color:var(--wishlist);
  }
  .dupe-warn.show{display:block;}

  .empty-state{
    max-width:420px; margin:60px auto; text-align:center; padding:0 20px;
    color:var(--text-dim);
  }
  .empty-state .em-title{font-family:var(--font-display); font-size:26px; letter-spacing:1px; color:var(--text); margin-bottom:6px;}
  .empty-state p{font-size:13.5px; line-height:1.5;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:20px; bottom:24px; z-index:25;
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:#14141a; border:none;
    font-size:28px; font-weight:600;
    box-shadow:0 10px 24px rgba(212,165,55,0.35);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .fab:hover{transform:scale(1.06);}
  .fab:active{transform:scale(0.96);}

  .fab-scan{
    position:fixed; right:26px; bottom:96px; z-index:25;
    width:46px; height:46px; border-radius:50%;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center;
  }
  .fab-scan:hover{border-color:var(--accent); color:var(--accent-light);}

  /* ---------- Barcode scanner ---------- */
  .scan-overlay{position:fixed; inset:0; background:#000; z-index:80; display:none; align-items:center; justify-content:center;}
  .scan-overlay.open{display:flex;}
  #scanVideo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .scan-frame{
    position:relative; width:min(80vw,420px); height:150px; z-index:1;
    border:2px solid var(--accent); border-radius:12px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,0.45);
  }
  .scan-hint{
    position:absolute; bottom:72px; left:0; right:0; text-align:center; z-index:2;
    color:#fff; font-size:14px; text-shadow:0 1px 4px #000;
  }
  .scan-close{position:absolute; top:18px; right:18px; z-index:2;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); padding:9px 16px; border-radius:999px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:all .25s ease;
    z-index:60; font-family:var(--font-mono);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{border-color:var(--danger); color:var(--danger);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,14,0.72);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
    backdrop-filter:blur(3px);
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--surface); width:100%; max-width:520px;
    max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0;
    border:1px solid var(--border); border-bottom:none;
    padding:20px 20px 28px;
    animation:slideUp .22s ease;
  }
  @media (min-width:640px){
    .modal-overlay{align-items:center;}
    .modal-panel{border-radius:16px; border-bottom:1px solid var(--border); margin:20px;}
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-title{font-family:var(--font-display); font-size:24px; letter-spacing:1px;}
  .form-group{margin-bottom:16px;}
  .form-group label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--text-faint); margin-bottom:6px; font-weight:600;
  }
  .form-row{display:flex; gap:10px;}
  .form-row .form-group{flex:1;}
  .lookup-wrap{position:relative;}
  .lookup-results{
    position:absolute; top:100%; left:0; right:0; z-index:5;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); overflow:hidden; display:none;
    box-shadow:0 12px 28px rgba(0,0,0,0.45);
  }
  .lookup-results.open{display:block;}
  .lookup-item{
    display:flex; gap:10px; align-items:center; width:100%;
    background:none; border:none; border-bottom:1px solid var(--border-soft);
    padding:8px 10px; color:var(--text); text-align:left; font-size:13px;
  }
  .lookup-item:last-child{border-bottom:none;}
  .lookup-item:hover{background:var(--surface);}
  .lookup-item img{width:32px; height:48px; object-fit:cover; border-radius:4px; background:var(--bg); flex:0 0 auto;}
  .lookup-item .li-year{color:var(--text-faint); font-family:var(--font-mono); font-size:11px;}
  .poster-picker{display:flex; align-items:center; gap:8px; min-height:42px;}
  .poster-picker img{width:40px; height:60px; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
  .poster-pick-btn,.poster-remove-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:12px; font-weight:600;
  }
  .poster-pick-btn:hover{color:var(--text); border-color:var(--accent);}
  .poster-remove-btn{color:var(--danger); border-color:var(--danger);}
  input[type=text],input[type=number],input[type=url],input[type=date],textarea,.field-select{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:var(--radius-sm); padding:10px 12px; font-size:14px;
  }
  input[type=date]{color-scheme:dark;}
  textarea{resize:vertical; min-height:60px;}
  input:focus,textarea:focus,.field-select:focus{border-color:var(--accent);}

  .format-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .format-option{
    display:flex; flex-direction:column; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:8px 10px; min-width:110px;
  }
  .format-toggle{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--text-dim);
  }
  .format-toggle input{accent-color:var(--accent); width:15px; height:15px;}
  .format-option.on{border-color:var(--accent);}
  .format-option.on .format-toggle{color:var(--text);}
  .format-price{display:none; width:100%;}
  .format-option.on .format-price{display:block;}
  .format-price input{padding:6px 8px; font-size:12.5px; font-family:var(--font-mono);}

  .star-picker{display:flex; gap:4px; align-items:center;}
  .star-picker button{
    background:none; border:none; font-size:26px; color:var(--border); line-height:1; padding:2px;
  }
  .star-picker button.filled{color:var(--accent);}
  .clear-rating{font-size:11px; color:var(--text-faint); background:none; border:none; margin-left:8px; text-decoration:underline;}

  .pill-input-wrap{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:8px; min-height:42px;
  }
  .pill{
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-size:12px; padding:4px 8px; border-radius:6px;
    display:flex; align-items:center; gap:6px;
  }
  .pill button{background:none; border:none; color:currentColor; opacity:.65; font-size:13px; line-height:1;}
  .pill-input-wrap input{
    border:none; background:none; flex:1; min-width:80px; padding:4px; font-size:13px;
  }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; margin-bottom:16px;
  }
  .toggle-row .toggle-label{font-size:13.5px; font-weight:600;}
  .toggle-row .toggle-sub{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .switch{position:relative; width:42px; height:24px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .track{
    position:absolute; inset:0; background:var(--border); border-radius:999px; transition:.2s;
  }
  .switch .knob{
    position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:var(--text); transition:.2s;
  }
  .switch input:checked + .track{background:var(--wishlist);}
  .switch input:checked + .track .knob{transform:translateX(18px);}
  .switch input:checked ~ .knob{transform:translateX(18px); background:#fff;}

  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:12px; border-radius:var(--radius-sm); border:none;
    font-size:14px; font-weight:700; letter-spacing:.3px;
  }
  .btn-primary{background:var(--accent); color:#14141a;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger-outline{
    background:none; border:1px solid var(--danger); color:var(--danger);
    padding:10px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
    width:100%; margin-top:10px;
  }

  .color-section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; font-weight:600;
    color:var(--text-faint); margin:18px 0 4px;
  }
  .color-section-title:first-child{margin-top:0;}
  .tag-color-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--border-soft);
  }
  .tag-color-row:last-child{border-bottom:none;}
  .tag-color-name{
    font-size:13px; padding:3px 9px; border-radius:6px;
    background:var(--surface-2); color:var(--text-dim);
  }
  .color-dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .color-dot{
    width:22px; height:22px; border-radius:50%; padding:0;
    border:2px solid transparent; font-size:10px; line-height:1; color:var(--text-faint);
  }
  .color-dot.none{background:var(--surface-2); border-color:var(--border);}
  .color-dot.selected{border-color:#fff;}
  .native-swatch{
    width:22px; height:22px; padding:0; border:2px solid var(--border); border-radius:50%;
    background:none; cursor:pointer; overflow:hidden;
  }
  .native-swatch::-webkit-color-swatch-wrapper{padding:0;}
  .native-swatch::-webkit-color-swatch{border:none; border-radius:50%;}
  .native-swatch::-moz-color-swatch{border:none; border-radius:50%;}

  /* ---------- Stats dashboard ---------- */
  .stat-hero{
    text-align:center; padding:18px 12px; margin-bottom:4px;
    background:var(--surface-2); border-radius:var(--radius-sm); border:1px solid var(--border);
  }
  .stat-hero .hero-num{font-family:var(--font-display); font-size:34px; color:var(--accent-light); letter-spacing:.5px;}
  .stat-hero .hero-label{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .donut-row{display:flex; align-items:center; gap:20px; margin:4px 0;}
  .donut{width:120px; height:120px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .donut-hole{
    width:60px; height:60px; border-radius:50%; background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim); text-align:center; line-height:1.3;
  }
  .donut-legend{display:flex; flex-direction:column; gap:6px; flex:1;}
  .donut-legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim);}
  .donut-swatch{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}
  .avg-price-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:13px;
  }
  .avg-price-row:last-child{border-bottom:none;}
  .avg-price-row .avg-num{font-family:var(--font-mono); color:var(--accent-light); font-weight:600;}
  .bar-list{display:flex; flex-direction:column; gap:8px;}
  .bar-row{display:flex; align-items:center; gap:10px;}
  .bar-row .bar-label{font-size:12px; color:var(--text-dim); width:96px; flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-row .bar-track{flex:1; background:var(--surface-2); border-radius:4px; height:16px; overflow:hidden;}
  .bar-row .bar-fill{height:100%; border-radius:4px; background:var(--accent);}
  .bar-row .bar-num{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); width:22px; text-align:right; flex:0 0 auto;}
  .month-strip{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 6px; align-items:flex-end; height:130px;}
  .month-bar-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; flex:0 0 auto; width:40px; height:100%; justify-content:flex-end;}
  .month-bar{width:22px; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px;}
  .month-bar-amt{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); white-space:nowrap;}
  .month-bar-label{font-family:var(--font-mono); font-size:9.5px; color:var(--text-dim); white-space:nowrap;}
  .stats-empty{color:var(--text-dim); font-size:13px; margin:0 0 8px;}

  /* ---------- Movie detail ---------- */
  .detail-header-row{display:flex; gap:14px; margin-bottom:6px;}
  .detail-poster{width:110px; flex:0 0 auto; aspect-ratio:2/3; object-fit:cover; border-radius:var(--radius-sm); display:block;}
  .detail-poster-placeholder{
    width:110px; flex:0 0 auto; aspect-ratio:2/3; border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    color:var(--text-faint); font-family:var(--font-display); font-size:30px;
  }
  .detail-header-info{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .detail-badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px;}
  .detail-notes{
    font-size:13.5px; color:var(--text-dim); line-height:1.5; white-space:pre-wrap;
    background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px;
  }
  .detail-pills{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 4px;}

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(10,10,14,0.8); z-index:70;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px; max-width:340px; width:100%;
  }
  .confirm-box h3{margin:0 0 8px; font-family:var(--font-display); font-size:20px; letter-spacing:.5px;}
  .confirm-box p{margin:0 0 16px; font-size:13.5px; color:var(--text-dim); line-height:1.5;}
  .confirm-actions{display:flex; gap:10px;}

  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="wordmark">SPINE<span class="dot">.</span></div>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-appmode="movies">Movies</button>
        <button class="mode-btn" data-appmode="books">Books</button>
      </div>
      <div class="header-actions">
        <div class="sync-indicator"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">synced</span></div>
        <div style="position:relative;">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">⋯</button>
          <div class="menu-dropdown" id="menuDropdown">
            <button id="authBtn" style="display:none;">👤 Sign in with Google to sync</button>
            <button id="exportBtn">⬇ Export backup (.json)</button>
            <button id="importBtn">⬆ Import backup (.json)</button>
            <button id="tmdbKeyBtn">🔑 TMDB API key</button>
            <button id="omdbKeyBtn">🎬 OMDb key (IMDb ratings)</button>
            <button id="colorsBtn">🎨 Colors</button>
            <button id="statsBtn">📊 Stats</button>
            <button id="backfillBtn">⟳ Backfill missing info</button>
            <button class="danger-item" id="clearAllBtn">✕ Clear all data</button>
          </div>
        </div>
      </div>
    </div>
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="Search title, tag, or collection…">
    </div>
    <div class="stats-strip" id="statsStrip"></div>
    <div class="filter-bar">
      <div class="segmented" id="segmented">
        <button data-mode="all" class="active">All</button>
        <button data-mode="owned">Owned</button>
        <button data-mode="wishlist">Wishlist</button>
      </div>
      <div class="chip-scroll" id="formatChips">
        <button class="chip fmt-4k" data-fmt="4K UHD">4K UHD</button>
        <button class="chip fmt-bluray" data-fmt="Blu-ray">Blu-ray</button>
        <button class="chip fmt-dvd" data-fmt="DVD">DVD</button>
        <button class="chip fmt-digital" data-fmt="Digital">Digital</button>
      </div>
      <div class="chip-scroll" id="bookFormatChips" style="display:none;">
        <button class="chip fmt-hardcover" data-bfmt="Hardcover">Hardcover</button>
        <button class="chip fmt-paperback" data-bfmt="Paperback">Paperback</button>
        <button class="chip fmt-ebook" data-bfmt="Ebook">Ebook</button>
        <button class="chip fmt-audiobook" data-bfmt="Audiobook">Audiobook</button>
      </div>
      <div class="chip-scroll" id="ratingChips"></div>
      <div class="chip-scroll" id="readStatusChips" style="display:none;">
        <button class="chip" data-rstat="unread">Unread</button>
        <button class="chip" data-rstat="reading">Reading</button>
        <button class="chip" data-rstat="read">Read</button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="recent">Recently added</option>
        <option value="title">Title A–Z</option>
        <option value="year-new">Year: newest</option>
        <option value="year-old">Year: oldest</option>
        <option value="price-high">Price: high–low</option>
        <option value="rating">Rating: high–low</option>
      </select>
      <button class="view-toggle" id="viewToggle" title="List view">☰</button>
    </div>
    <div class="collection-bar" id="collectionChips"></div>
  </header>

  <main>
    <div class="movie-grid" id="movieGrid"></div>
  </main>

  <button class="fab" id="fabAdd" aria-label="Add movie">+</button>
  <button class="fab-scan" id="scanFab" aria-label="Scan barcode">SCAN</button>

  <!-- Barcode scanner -->
  <div class="scan-overlay" id="scanOverlay">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="scan-hint">Point at the barcode on the back of the case</div>
    <button class="icon-btn scan-close" id="scanCloseBtn" aria-label="Close scanner">✕</button>
  </div>
  <div class="toast" id="toast"></div>
  <input type="file" id="importFile" accept="application/json" class="visually-hidden">
  <input type="file" id="posterFile" accept="image/*" class="visually-hidden">
  <input type="file" id="bookPosterFile" accept="image/*" class="visually-hidden">

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Add Movie</div>
        <button class="icon-btn" id="closeModalBtn" aria-label="Close">✕</button>
      </div>
      <form id="movieForm">
        <div class="form-group lookup-wrap">
          <label for="titleInput">Title</label>
          <input type="text" id="titleInput" required placeholder="start typing to search…" autocomplete="off">
          <div class="lookup-results" id="lookupResults"></div>
          <div class="dupe-warn" id="dupeWarn"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="yearInput">Year</label>
            <input type="number" id="yearInput" placeholder="2017" min="1890" max="2100">
          </div>
          <div class="form-group">
            <label for="releaseMonthSelect">Month</label>
            <select class="field-select" id="releaseMonthSelect">
              <option value="">—</option>
              <option value="1">Jan</option>
              <option value="2">Feb</option>
              <option value="3">Mar</option>
              <option value="4">Apr</option>
              <option value="5">May</option>
              <option value="6">Jun</option>
              <option value="7">Jul</option>
              <option value="8">Aug</option>
              <option value="9">Sep</option>
              <option value="10">Oct</option>
              <option value="11">Nov</option>
              <option value="12">Dec</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Box art</label>
          <div class="poster-picker">
            <img id="posterPreview" alt="" style="display:none;">
            <button type="button" class="poster-pick-btn" id="posterPickBtn">＋ Add image</button>
            <button type="button" class="poster-remove-btn" id="posterRemoveBtn" style="display:none;" aria-label="Remove image">✕</button>
          </div>
        </div>

        <div class="form-group">
          <label for="acquiredDateInput">Date Acquired</label>
          <input type="date" id="acquiredDateInput">
        </div>

        <div class="toggle-row">
          <div>
            <div class="toggle-label" id="wishlistLabel">I own this</div>
            <div class="toggle-sub">Toggle on if it's on your wishlist instead</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="wishlistToggle">
            <span class="track"><span class="knob"></span></span>
          </label>
        </div>

        <div class="form-group">
          <label>Formats</label>
          <div class="format-grid" id="formatGrid"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="diSelect">Digital Intermediate</label>
            <select class="field-select" id="diSelect">
              <option value="">Not researched</option>
              <option value="4K Native">4K Native</option>
              <option value="2K Upscale">2K Upscale</option>
            </select>
          </div>
          <div class="form-group">
            <label for="hdrSelect">HDR Type</label>
            <select class="field-select" id="hdrSelect">
              <option value="">Not researched</option>
              <option value="No 4K Available">No 4K Available</option>
              <option value="HDR">HDR</option>
              <option value="HDR10">HDR10</option>
              <option value="HDR10+">HDR10+</option>
              <option value="Dolby Vision">Dolby Vision</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="audioFormatSelect">Audio Format</label>
            <select class="field-select" id="audioFormatSelect"></select>
          </div>
          <div class="form-group">
            <label for="uhdYearInput">4K Release Year</label>
            <input type="number" id="uhdYearInput" placeholder="2019" min="2016" max="2100">
          </div>
        </div>

        <div class="form-group">
          <label for="aspectRatioSelect">Aspect Ratio</label>
          <select class="field-select" id="aspectRatioSelect"></select>
        </div>

        <div class="form-group">
          <label for="upgradePriceInput">Upgrade Price Estimate</label>
          <input type="number" id="upgradePriceInput" step="0.01" min="0" placeholder="e.g. 18.99">
        </div>

        <div class="form-group">
          <label>Your rating</label>
          <div class="star-picker" id="starPicker"></div>
        </div>

        <div class="form-group">
          <label for="tagsInput">Tags</label>
          <div class="pill-input-wrap" id="tagsWrap">
            <input type="text" id="tagsInput" placeholder="type & press enter…" list="tagSuggestions">
          </div>
          <datalist id="tagSuggestions"></datalist>
        </div>

        <div class="form-group">
          <label for="collectionsInput">Collections</label>
          <div class="pill-input-wrap" id="collectionsWrap">
            <input type="text" id="collectionsInput" placeholder="e.g. Criterion, Steelbooks…" list="collectionSuggestions">
          </div>
          <datalist id="collectionSuggestions"></datalist>
        </div>

        <div class="form-group">
          <label for="notesInput">Notes</label>
          <textarea id="notesInput" placeholder="e.g. 4K transfer is dark per Blu-ray.com, prefer the Blu-ray"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
        <button type="button" class="btn-danger-outline" id="deleteBtn" style="display:none;">Delete this entry</button>
      </form>
    </div>
  </div>

  <!-- Add/Edit Book Modal -->
  <div class="modal-overlay" id="bookModalOverlay">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title" id="bookModalTitle">Add Book</div>
        <button class="icon-btn" id="closeBookModalBtn" aria-label="Close">✕</button>
      </div>
      <form id="bookForm">
        <div class="form-group lookup-wrap">
          <label for="bookTitleInput">Title</label>
          <input type="text" id="bookTitleInput" required placeholder="start typing to search…" autocomplete="off">
          <div class="lookup-results" id="bookLookupResults"></div>
          <div class="dupe-warn" id="bookDupeWarn"></div>
        </div>

        <div class="form-group">
          <label for="authorInput">Author</label>
          <input type="text" id="authorInput" placeholder="e.g. Frank Herbert">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="publishYearInput">Publish Year</label>
            <input type="number" id="publishYearInput" placeholder="1965" min="1400" max="2100">
          </div>
          <div class="form-group">
            <label for="pageCountInput">Page Count</label>
            <input type="number" id="pageCountInput" placeholder="412" min="0">
          </div>
        </div>

        <div class="form-group">
          <label for="isbnInput">ISBN</label>
          <input type="text" id="isbnInput" placeholder="e.g. 9780441172719">
        </div>

        <div class="form-group">
          <label>Cover art</label>
          <div class="poster-picker">
            <img id="bookPosterPreview" alt="" style="display:none;">
            <button type="button" class="poster-pick-btn" id="bookPosterPickBtn">＋ Add image</button>
            <button type="button" class="poster-remove-btn" id="bookPosterRemoveBtn" style="display:none;" aria-label="Remove image">✕</button>
          </div>
        </div>

        <div class="form-group">
          <label for="bookAcquiredDateInput">Date Acquired</label>
          <input type="date" id="bookAcquiredDateInput">
        </div>

        <div class="toggle-row">
          <div>
            <div class="toggle-label" id="bookWishlistLabel">I own this</div>
            <div class="toggle-sub">Toggle on if it's on your wishlist instead</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="bookWishlistToggle">
            <span class="track"><span class="knob"></span></span>
          </label>
        </div>

        <div class="form-group">
          <label>Formats</label>
          <div class="format-grid" id="bookFormatGrid"></div>
        </div>

        <div class="form-group">
          <label for="readStatusSelect">Read Status</label>
          <select class="field-select" id="readStatusSelect">
            <option value="">Not set</option>
            <option value="unread">Unread</option>
            <option value="reading">Reading</option>
            <option value="read">Read</option>
          </select>
        </div>

        <div class="form-group">
          <label>Your rating</label>
          <div class="star-picker" id="bookStarPicker"></div>
        </div>

        <div class="form-group">
          <label for="genreInput">Genre</label>
          <div class="pill-input-wrap" id="genreWrap">
            <input type="text" id="genreInput" placeholder="type & press enter…" list="genreSuggestions">
          </div>
          <datalist id="genreSuggestions"></datalist>
        </div>

        <div class="form-group">
          <label for="seriesInput">Series</label>
          <div class="pill-input-wrap" id="seriesWrap">
            <input type="text" id="seriesInput" placeholder="e.g. Harry Potter…" list="seriesSuggestions">
          </div>
          <datalist id="seriesSuggestions"></datalist>
        </div>

        <div class="form-group">
          <label for="bookNotesInput">Notes</label>
          <textarea id="bookNotesInput" placeholder="e.g. Signed copy from author's tour stop"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="bookCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="bookSaveBtn">Save</button>
        </div>
        <button type="button" class="btn-danger-outline" id="bookDeleteBtn" style="display:none;">Delete this entry</button>
      </form>
    </div>
  </div>

  <!-- Colors -->
  <div class="modal-overlay" id="colorsOverlay">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title">Colors</div>
        <button class="icon-btn" id="closeColorsBtn" aria-label="Close">✕</button>
      </div>
      <div id="colorsList"></div>

    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title">Stats</div>
        <button class="icon-btn" id="closeStatsBtn" aria-label="Close">✕</button>
      </div>
      <div id="statsContent"></div>

  <!-- Movie detail -->
  <div class="modal-overlay" id="detailOverlay">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title" id="detailTitle">&nbsp;</div>
        <button class="icon-btn" id="closeDetailBtn" aria-label="Close">✕</button>
      </div>
      <div id="detailContent"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="detailCloseBtn">Close</button>
        <button type="button" class="btn btn-primary" id="detailEditBtn">✎ Edit</button>
      </div>
    </div>

  <!-- Book detail -->
  <div class="modal-overlay" id="bookDetailOverlay">
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title" id="bookDetailTitle">&nbsp;</div>
        <button class="icon-btn" id="closeBookDetailBtn" aria-label="Close">✕</button>
      </div>
      <div id="bookDetailContent"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="bookDetailCloseBtn">Close</button>
        <button type="button" class="btn btn-primary" id="bookDetailEditBtn">✎ Edit</button>
      </div>
    </div>
  </div>

    try{
      const snap = await userCol().get();
      const cloudIds = new Set(snap.docs.map(d=>d.id));
      const localRaw = localStorage.getItem(STORAGE_KEY);
      const local = localRaw ? JSON.parse(localRaw) : [];

        const batch = fbDb.batch();
        toUpload.slice(i, i+450).forEach(m=> batch.set(userCol().doc(m.id), m));
        await batch.commit();

  function getFiltered(){
    let list = movies.slice();
    if(filterMode === 'owned') list = list.filter(m=>!m.wishlist);
    if(filterMode === 'wishlist') list = list.filter(m=>m.wishlist);
    if(activeFormatFilters.size){
      list = list.filter(m => (m.formats||[]).some(f => activeFormatFilters.has(f.type)));
    }
    if(activeRatingFilters.size){
      list = list.filter(m => activeRatingFilters.has(m.contentRating));
    }
    if(activeCollection){
      list = list.filter(m => (m.collections||[]).includes(activeCollection));
    }
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      list = list.filter(m =>
        (m.title||'').toLowerCase().includes(q) ||
        (m.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
        (m.collections||[]).some(c=>c.toLowerCase().includes(q))
      );
    }
    switch(sortBy){
      case 'title': list.sort((a,b)=>(a.title||'').localeCompare(b.title||'')); break;
      case 'year-new': list.sort((a,b)=> (b.year||0) - (a.year||0)); break;
      case 'year-old': list.sort((a,b)=> (a.year||9999) - (b.year||9999)); break;
      case 'price-high': list.sort((a,b)=> priceOf(b) - priceOf(a)); break;
      case 'rating': list.sort((a,b)=> (b.rating||0) - (a.rating||0)); break;
      default: list.sort((a,b)=> (b.dateAdded||0) - (a.dateAdded||0));
    }
    return list;
  }
  function priceOf(m){
    return (m.formats||[]).reduce((s,f)=> s + (parseFloat(f.price)||0), 0);
  }

    if(filterMode === 'wishlist') list = list.filter(b=>b.wishlist);
    if(activeBookFormatFilters.size){
      list = list.filter(b => (b.formats||[]).some(f => activeBookFormatFilters.has(f.type)));
    }
    if(activeReadStatusFilters.size){
      list = list.filter(b => activeReadStatusFilters.has(b.readStatus));
    }
    if(activeBookCollection){
      list = list.filter(b => (b.collections||[]).includes(activeBookCollection));
    }
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      list = list.filter(b =>
        (b.title||'').toLowerCase().includes(q) ||
        (b.author||'').toLowerCase().includes(q) ||
        (b.isbn||'').toLowerCase().includes(q) ||
        (b.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
        (b.collections||[]).some(c=>c.toLowerCase().includes(q))
      );
    }
    switch(sortBy){
      case 'title': list.sort((a,b)=>(a.title||'').localeCompare(b.title||'')); break;
      case 'year-new': list.sort((a,b)=> (b.publishYear||0) - (a.publishYear||0)); break;
      case 'year-old': list.sort((a,b)=> (a.publishYear||9999) - (b.publishYear||9999)); break;
      case 'price-high': list.sort((a,b)=> bookPriceOf(b) - bookPriceOf(a)); break;
      case 'rating': list.sort((a,b)=> (b.rating||0) - (a.rating||0)); break;
      default: list.sort((a,b)=> (b.dateAdded||0) - (a.dateAdded||0));
    }
    return list;
  }

  // ---------- Stats dashboard aggregates ----------
  function upgradeTotal(){
    const targets = movies.filter(m=> m.upgradePrice && !(m.formats||[]).some(f=>f.type==='4K UHD'));
    return { total: targets.reduce((s,m)=> s + m.upgradePrice, 0), count: targets.length };
  }
  function formatAverages(){
    const sums = {}, counts = {};
    FORMAT_TYPES.forEach(t=>{ sums[t] = 0; counts[t] = 0; });
    movies.filter(m=>!m.wishlist).forEach(m=>{
      (m.formats||[]).forEach(f=>{
        if(sums.hasOwnProperty(f.type)){ sums[f.type] += (parseFloat(f.price)||0); counts[f.type]++; }
      });
    });
    return FORMAT_TYPES.map(t=>({ type:t, avg: counts[t] ? sums[t]/counts[t] : null, count: counts[t] }));
  }
  function topCollections(n){
    const counts = {};
    movies.forEach(m=> (m.collections||[]).forEach(c=> counts[c] = (counts[c]||0) + 1));
    return Object.entries(counts).sort((a,b)=> b[1]-a[1]).slice(0, n||10);
  }
  function monthBucket(m){
    const d = m.acquiredDate || (m.dateAdded ? new Date(m.dateAdded).toISOString().slice(0,7) : '');
    return d ? d.slice(0,7) : '';
  }
  function spendByMonth(){
    const sums = {};
    movies.filter(m=>!m.wishlist).forEach(m=>{
      const bucket = monthBucket(m);
      if(!bucket) return;
      sums[bucket] = (sums[bucket]||0) + priceOf(m);
    });
    return Object.entries(sums).sort((a,b)=> a[0].localeCompare(b[0]));
  }
  function monthLabel(ym){
    const [y,mo] = ym.split('-');
    return MONTH_NAMES[parseInt(mo,10)-1] + " '" + y.slice(2);

    if(m.hdrType === 'Dolby Vision'){ const c=badgeColor('Dolby Vision'); badges += `<span class="badge quality" style="background:${c}; color:${contrastText(c)}">DOLBY VISION</span>`; }
    const stars = [1,2,3,4,5].map(i => `<span class="star-static ${i<=(m.rating||0)?'filled':''}">★</span>`).join('');

    return [...s].sort((a,b)=>{
      const ia = RATING_ORDER.indexOf(a), ib = RATING_ORDER.indexOf(b);
      if(ia===-1 && ib===-1) return a.localeCompare(b);
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    });
  }

  // fetch runtime + IMDb id + US content rating from TMDB details; real IMDb rating from OMDb when a key is set
  function extractUSCertification(releaseDatesData){
    const us = (releaseDatesData.results || []).find(r=>r.iso_3166_1 === 'US');
    if(!us) return '';
    const dates = us.release_dates || [];
    const theatrical = dates.find(rd=>rd.type===3 && rd.certification);
    if(theatrical) return theatrical.certification;
    const any = dates.find(rd=>rd.certification);
    return any ? any.certification : '';
  }
  let extrasSeq = 0;
  async function fetchMovieExtras(tmdbId, tmdbVote){
    const seq = ++extrasSeq;
    formTmdbRating = (tmdbVote || tmdbVote === 0) ? Math.round(tmdbVote * 10) / 10 : null;
    formRuntime = null; formImdbRating = null; formImdbId = ''; formContentRating = '';
    if(!tmdbId) return;
    try{
      const [dres, crres] = await Promise.all([
        fetch('https://api.themoviedb.org/3/movie/' + tmdbId + '?api_key=' + encodeURIComponent(tmdbKey())),
        fetch('https://api.themoviedb.org/3/movie/' + tmdbId + '/release_dates?api_key=' + encodeURIComponent(tmdbKey()))
      ]);
      const d = await dres.json();
      const cr = await crres.json();
      if(seq !== extrasSeq) return;
      formRuntime = d.runtime || null;
      formImdbId = d.imdb_id || '';
      formContentRating = extractUSCertification(cr);
      if(formImdbId && omdbKey()){
        const or = await fetch('https://www.omdbapi.com/?apikey=' + encodeURIComponent(omdbKey()) + '&i=' + encodeURIComponent(formImdbId));
        const od = await or.json();
        if(seq !== extrasSeq) return;
        const iv = parseFloat(od.imdbRating);
        if(!isNaN(iv)) formImdbRating = iv;
      }
    }catch(e){}
  }

  async function runLookup(q){
    const seq = ++lookupSeq;
    const box = $('lookupResults');
    if(!tmdbKey()){
      box.innerHTML = `<button type="button" class="lookup-item" id="lookupKeyHint"><span>🔑 Movie lookup needs a free TMDB key — tap to add yours</span></button>`;

      return;
    }
    try{
      const res = await fetch('https://api.themoviedb.org/3/search/movie?api_key=' + encodeURIComponent(tmdbKey()) + '&query=' + encodeURIComponent(q) + '&include_adult=false');
      const data = await res.json();
      if(seq !== lookupSeq) return; // a newer search superseded this one
      const results = (data.results || []).slice(0,6).map(r=>({
        id: r.id,
        vote: (typeof r.vote_average === 'number') ? r.vote_average : null,
        title: r.title,
        year: r.release_date ? parseInt(r.release_date.slice(0,4)) : null,
        month: r.release_date ? parseInt(r.release_date.slice(5,7)) : null,
        genres: (r.genre_ids || []).slice(0,3).map(id=>TMDB_GENRES[id]).filter(Boolean),
        thumb: r.poster_path ? 'https://image.tmdb.org/t/p/w92' + r.poster_path : '',
        poster: r.poster_path ? 'https://image.tmdb.org/t/p/w342' + r.poster_path : ''
      })).filter(r=>r.title);
      if(!results.length){ hideLookup(); return; }
      box.innerHTML = results.map((r,i)=>`
        <button type="button" class="lookup-item" data-i="${i}">
          ${r.thumb ? `<img src="${escapeHtml(r.thumb)}" alt="" loading="lazy">` : ''}
          <span>${escapeHtml(r.title)} <span class="li-year">${r.year || ''}</span></span>
        </button>`).join('');
      box.classList.add('open');
      box.querySelectorAll('.lookup-item').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const r = results[parseInt(btn.dataset.i)];
          $('titleInput').value = r.title;
          checkDuplicate(r.title);
          fetchMovieExtras(r.id, r.vote);
          $('releaseMonthSelect').value = r.month || '';
          if(r.year) $('yearInput').value = r.year;
          if(r.poster){ formPosterUrl = r.poster; updatePosterPreview(); }

          });
          if(added) buildPills('tagsWrap', formTags, 'tagsInput');
          hideLookup();
        });
      });
    }catch(e){
      if(seq === lookupSeq) hideLookup(); // offline or API hiccup — fail quiet, manual entry still works
    }

  // ---------- Book lookup (Open Library — free, no key) ----------
  function cleanSubjects(subjects){
    return (subjects||[]).filter(s => s && s.length < 30 && !/[:=\d]/.test(s)).slice(0,3);
  }
  let bookLookupTimer = null;
  let bookLookupSeq = 0;
  function hideBookLookup(){
    $('bookLookupResults').classList.remove('open');
    $('bookLookupResults').innerHTML = '';
  }
  $('bookTitleInput').addEventListener('input', ()=>{
    const q = $('bookTitleInput').value.trim();
    checkBookDuplicate(q);
    clearTimeout(bookLookupTimer);
    if(q.length < 3){ hideBookLookup(); return; }
    bookLookupTimer = setTimeout(()=> runBookLookup(q), 450);
  });
  async function runBookLookup(q){
    const seq = ++bookLookupSeq;
    const box = $('bookLookupResults');
    try{
      const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(q)
        + '&limit=6&fields=title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median,ratings_average,ratings_count,subject';
      const res = await fetch(url);
      const data = await res.json();
      if(seq !== bookLookupSeq) return;
      const results = (data.docs || []).slice(0,6).map(d=>({
        title: d.title,
        author: (d.author_name||[])[0] || '',
        year: d.first_publish_year || null,
        isbn13: (d.isbn||[]).find(i=>i.length===13) || (d.isbn||[])[0] || '',
        pages: d.number_of_pages_median || null,
        rating: (typeof d.ratings_average === 'number') ? d.ratings_average : null,
        ratingCount: d.ratings_count || null,
        genres: cleanSubjects(d.subject),
        thumb: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-S.jpg' : '',
        poster: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg' : ''
      })).filter(r=>r.title);
      if(!results.length){ hideBookLookup(); return; }

  let scanStream = null, scanTimer = null, scanReady = false;
  const normUpc = c => String(c || '').replace(/^0+/, '');

  (async ()=>{
    try{
      if('BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        const fmts = await BarcodeDetector.getSupportedFormats();
        scanReady = fmts.includes('upc_a') || fmts.includes('ean_13');
      }
    }catch(e){}
    if(!scanReady) $('scanFab').style.display = 'none';
  })();

  async function openScanner(){
    if(!scanReady) return;
    $('scanOverlay').classList.add('open');
    try{
      scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
      const video = $('scanVideo');
      video.srcObject = scanStream;
      await video.play();
      const detector = new BarcodeDetector({formats:['upc_a','upc_e','ean_13','ean_8']});
      const tick = async ()=>{
        if(!scanStream) return;
        try{
          const codes = await detector.detect(video);
          if(codes.length && codes[0].rawValue){
            if(navigator.vibrate) navigator.vibrate(80);
            const code = codes[0].rawValue;
            closeScanner();
            if(currentMode === 'books') handleBookScan(code); else handleScan(code);
            return;
          }
        }catch(e){}
        scanTimer = setTimeout(tick, 180);
      };
      tick();
    }catch(e){
      closeScanner();
      showToast('Camera unavailable', true);
    }
  }

  function closeScanner(){
    clearTimeout(scanTimer);
    if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
    $('scanVideo').srcObject = null;
    $('scanOverlay').classList.remove('open');
  }

  function cleanUpcTitle(t){
    return t
      .replace(/\(.*?\)|\[.*?\]/g, ' ')
      .replace(/\b(4k|ultra\s?hd|uhd|blu-?ray|dvd|digital|steelbook|widescreen|full\s?screen|collector'?s|limited|anniversary|edition|combo|pack|disc|copy|remastered|new|sealed)\b/gi, ' ')
      .replace(/[+\/|,]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  async function lookupUpc(code){
    try{
      const res = await fetch('https://world.openproductsfacts.org/api/v0/product/' + encodeURIComponent(code) + '.json');
      const data = await res.json();
      if(data.status === 1 && data.product && data.product.product_name) return data.product.product_name;
    }catch(e){}
    return '';
  }

  async function handleScan(code){
    const owned = movies.find(m => m.upc && normUpc(m.upc) === normUpc(code));
    if(owned){
      showToast((owned.wishlist ? '♥ On your wishlist: ' : '✓ You own this: ') + owned.title);
      openEditModal(owned.id);
      return;
    }
    showToast('Looking up barcode…');
    const raw = await lookupUpc(code);
    openAddModal();
    pendingUpc = code;
    if(raw){
      if(/4k|ultra\s?hd|\buhd\b/i.test(raw)) formFormats['4K UHD'] = '';
      if(/blu-?ray/i.test(raw)) formFormats['Blu-ray'] = '';
      if(/\bdvd\b/i.test(raw)) formFormats['DVD'] = '';
      buildFormatGrid();
      $('titleInput').value = cleanUpcTitle(raw);
      $('titleInput').dispatchEvent(new Event('input')); // trigger the TMDB dropdown to confirm the match
    } else {
      showToast('Not in the barcode database — type the title', true);
    }
  }

  async function handleBookScan(code){
    const isbn = normUpc(code);
    const owned = books.find(b => b.isbn && normUpc(b.isbn) === isbn);
    if(owned){
      showToast((owned.wishlist ? '♥ On your wishlist: ' : '✓ You own this: ') + owned.title);
      openBookEditModal(owned.id);
      return;
    }
    showToast('Looking up ISBN…');
    openAddBookModal();
    pendingIsbn = code;
    $('isbnInput').value = code;
    try{
      const res = await fetch('https://openlibrary.org/search.json?q=isbn:' + encodeURIComponent(code)
        + '&limit=1&fields=title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median,ratings_average,ratings_count,subject');
      const data = await res.json();
      const d = (data.docs || [])[0];
      if(d){
        $('bookTitleInput').value = d.title || '';
        checkBookDuplicate(d.title || '');
        $('authorInput').value = (d.author_name||[])[0] || '';
        if(d.first_publish_year) $('publishYearInput').value = d.first_publish_year;
        if(d.number_of_pages_median) $('pageCountInput').value = d.number_of_pages_median;
        if(d.cover_i){ formBookPosterUrl = 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg'; updateBookPosterPreview(); }
        formBookPublicRating = (typeof d.ratings_average === 'number') ? d.ratings_average : null;
        formBookPublicRatingCount = d.ratings_count || null;
        let added = false;
        cleanSubjects(d.subject).forEach(g=>{
          const gl = g.toLowerCase();
          if(!formBookTags.includes(gl)){ formBookTags.push(gl); added = true; }
        });
        if(added) buildPills('genreWrap', formBookTags, 'genreInput');
      } else {
        showToast('Not in the ISBN database — type the title', true);
      }
    }catch(e){
      showToast('Not in the ISBN database — type the title', true);
    }
  }

  function buildPills(wrapId, arr, inputId){
    const wrap = $(wrapId);
    wrap.querySelectorAll('.pill').forEach(p=>p.remove());
    const input = $(inputId);
    arr.forEach(val=>{
      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.innerHTML = `${escapeHtml(val)} <button type="button" aria-label="Remove">✕</button>`;
      if((wrapId === 'tagsWrap' || wrapId === 'genreWrap') && tagColors[val]){
        pill.style.background = tagColors[val];
        pill.style.color = contrastText(tagColors[val]);
        pill.style.borderColor = tagColors[val];
      }
      if((wrapId === 'collectionsWrap' || wrapId === 'seriesWrap') && collectionColors[val]){
        pill.style.background = collectionColors[val];
        pill.style.color = contrastText(collectionColors[val]);
        pill.style.borderColor = collectionColors[val];
      }
      pill.querySelector('button').addEventListener('click', ()=>{
        const idx = arr.indexOf(val);
        if(idx > -1) arr.splice(idx, 1);
        buildPills(wrapId, arr, inputId);
      });
      wrap.insertBefore(pill, input);
    });
  }

  function canonicalizeValue(v, pool){
    const lower = v.toLowerCase();
    const match = pool.find(p => p.toLowerCase() === lower);
    return match || v; // reuse the existing casing if this value already exists anywhere, case-insensitively
  }
  function setupPillInput(inputId, arr, wrapId){
    const input = $(inputId);
    const isTagLike = (wrapId === 'tagsWrap' || wrapId === 'genreWrap');
    const isCollLike = (wrapId === 'collectionsWrap' || wrapId === 'seriesWrap');
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ','){
        e.preventDefault();
        let v = input.value.trim().replace(/,$/,'');
        if(v){
          if(isTagLike) v = canonicalizeValue(v, [...allTags(), ...allGenres()]);
          else if(isCollLike) v = canonicalizeValue(v, [...allCollections(), ...allSeries()]);
          if(!arr.includes(v)){ arr.push(v); buildPills(wrapId, arr, inputId); }
        }
        input.value = '';
      } else if(e.key === 'Backspace' && !input.value && arr.length){
        arr.pop(); buildPills(wrapId, arr, inputId);
      }
    });
  }

  const POSTER_MAX_W = 400;
  function updatePosterPreview(){
    const prev = $('posterPreview'), pick = $('posterPickBtn'), rem = $('posterRemoveBtn');
    const src = formPosterData || formPosterUrl;
    if(src){
      prev.src = src; prev.style.display = 'block';

  $('posterFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, POSTER_MAX_W / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        formPosterData = canvas.toDataURL('image/jpeg', 0.72);
        updatePosterPreview();
      };
      img.onerror = ()=> showToast('Could not read that image', true);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ---------- Backfill: fetch missing runtime/ratings/posters/month/content-rating for old entries ----------
  function needsBackfill(m){
    return !m.runtime || !m.imdbId || !m.tmdbRating || !m.releaseMonth || !m.contentRating
      || (omdbKey() && !m.imdbRating)
      || (!m.posterUrl && !m.posterData);
  }

  async function backfillOne(m){
    let changed = false;
    try{
      if(!m.runtime || !m.imdbId || !m.tmdbRating || !m.year || !m.releaseMonth || !m.contentRating || (!m.posterUrl && !m.posterData)){
        const url = 'https://api.themoviedb.org/3/search/movie?api_key=' + encodeURIComponent(tmdbKey())
          + '&query=' + encodeURIComponent(m.title)
          + (m.year ? '&year=' + m.year : '') + '&include_adult=false';
        const res = await fetch(url);
        const data = await res.json();
        const sr = (data.results || [])[0];
        if(sr){
          if(!m.tmdbRating && typeof sr.vote_average === 'number'){ m.tmdbRating = Math.round(sr.vote_average * 10) / 10; changed = true; }
          if(!m.posterUrl && !m.posterData && sr.poster_path){ m.posterUrl = 'https://image.tmdb.org/t/p/w342' + sr.poster_path; changed = true; }
          if(!m.year && sr.release_date){ m.year = parseInt(sr.release_date.slice(0,4)); changed = true; }
          if(!m.releaseMonth && sr.release_date){ const mo = parseInt(sr.release_date.slice(5,7)); if(mo){ m.releaseMonth = mo; changed = true; } }
          if(!m.runtime || !m.imdbId || !m.contentRating){
            const dres = await fetch('https://api.themoviedb.org/3/movie/' + sr.id + '?api_key=' + encodeURIComponent(tmdbKey()));
            const d = await dres.json();
            if(!m.runtime && d.runtime){ m.runtime = d.runtime; changed = true; }
            if(!m.imdbId && d.imdb_id){ m.imdbId = d.imdb_id; changed = true; }
            if(!m.contentRating){
              const crres = await fetch('https://api.themoviedb.org/3/movie/' + sr.id + '/release_dates?api_key=' + encodeURIComponent(tmdbKey()));
              const cr = await crres.json();
              const rating = extractUSCertification(cr);
              if(rating){ m.contentRating = rating; changed = true; }
            }
          }
        }
      }
      if(omdbKey() && !m.imdbRating && m.imdbId){
        const or = await fetch('https://www.omdbapi.com/?apikey=' + encodeURIComponent(omdbKey()) + '&i=' + encodeURIComponent(m.imdbId));
        const od = await or.json();
        const iv = parseFloat(od.imdbRating);
        if(!isNaN(iv)){ m.imdbRating = iv; changed = true; }
      }
    }catch(e){}
    return changed;
  }

    const transferRows = [
      ['Digital Intermediate', m.digitalIntermediate],
      ['HDR Type', m.hdrType],
      ['Aspect Ratio', m.aspectRatio],
      ['Audio Format', (m.audioFormats||[])[0]],
      ['4K Release Year', m.uhdReleaseYear]
    ].filter(([,v])=>v);
    if(transferRows.length){
      html += '<div class="color-section-title">4K Transfer Info</div>';
      html += transferRows.map(([label,val])=>`<div class="avg-price-row"><span>${escapeHtml(label)}</span><span class="avg-num">${escapeHtml(String(val))}</span></div>`).join('');
    }

    if(m.rating){
      html += '<div class="color-section-title">Your Rating</div>';
      const stars = [1,2,3,4,5].map(i => `<span class="star-static ${i<=(m.rating||0)?'filled':''}">★</span>`).join('');
      html += `<div class="stars-row">${stars}</div>`;
    }

    if((m.tags||[]).length){
      html += '<div class="color-section-title">Tags</div>';
      html += '<div class="detail-pills">' + m.tags.map(t=>`<span class="tag-pill-mini" style="${tagStyle(t)}">${escapeHtml(t)}</span>`).join('') + '</div>';
    }

    if((m.collections||[]).length){
      html += '<div class="color-section-title">Collections</div>';
      html += '<div class="detail-pills">' + m.collections.map(c=>`<span class="tag-pill-mini" style="${collectionStyle(c)}">${escapeHtml(c)}</span>`).join('') + '</div>';
    }

    if(m.notes){
      html += '<div class="color-section-title">Notes</div>';
      html += `<div class="detail-notes">${escapeHtml(m.notes)}</div>`;
    }

    if(m.acquiredDate){
      html += '<div class="color-section-title">Acquired</div>';
      html += `<p class="stats-empty" style="margin:0;">${escapeHtml(m.acquiredDate)}</p>`;
    }

    $('detailContent').innerHTML = html;
  }
  function openDetailModal(id){
    const m = movies.find(x=>x.id===id);
    if(!m) return;
    renderMovieDetail(m);
    $('detailEditBtn').dataset.id = id;
    $('detailOverlay').classList.add('open');
  }
  $('detailCloseBtn').addEventListener('click', ()=> $('detailOverlay').classList.remove('open'));
  $('closeDetailBtn').addEventListener('click', ()=> $('detailOverlay').classList.remove('open'));
  $('detailOverlay').addEventListener('click', e=>{ if(e.target === $('detailOverlay')) $('detailOverlay').classList.remove('open'); });
  $('detailEditBtn').addEventListener('click', ()=>{
    const id = $('detailEditBtn').dataset.id;
    $('detailOverlay').classList.remove('open');
    openEditModal(id);
  });

  // ---------- Book detail ----------
  function renderBookDetail(b){
    $('bookDetailTitle').textContent = b.title || '';
    const letter = (b.title||'?').charAt(0).toUpperCase();
    const posterSrc = b.posterData || b.posterUrl || '';
    const posterBlock = posterSrc
      ? `<img class="detail-poster" src="${escapeHtml(posterSrc)}" alt="">`
      : `<div class="detail-poster-placeholder">${escapeHtml(letter)}</div>`;
    const infoLine = [b.publishYear || '', b.pageCount ? b.pageCount + ' pages' : null].filter(Boolean).join(' · ');

    let badges = '';
    if(b.wishlist) badges += `<span class="rating-badge" style="color:var(--wishlist); border-color:var(--wishlist);">WISHLIST</span>`;
    if(b.readStatus) badges += `<span class="rating-badge">${escapeHtml(READ_STATUS_LABEL[b.readStatus]||b.readStatus)}</span>`;

    let html = `<div class="detail-header-row">
      ${posterBlock}
      <div class="detail-header-info">
        ${b.author ? `<div class="card-year">${escapeHtml(b.author)}</div>` : ''}
        <div class="card-year">${escapeHtml(infoLine)}</div>
        ${bookScoreRow(b)}
        <div class="detail-badges">${badges}</div>
      </div>
    </div>`;

    html += '<div class="color-section-title">Formats Owned</div>';
    const formats = b.formats || [];
    if(!formats.length){
      html += '<p class="stats-empty">Not marked as owned in any format.</p>';
    } else {
      html += formats.map(f=>`
        <div class="avg-price-row"><span class="badge ${BOOK_FORMAT_CLASS[f.type]}">${escapeHtml(f.type)}</span><span class="avg-num">${f.price ? '$'+parseFloat(f.price).toFixed(2) : '—'}</span></div>
      `).join('');
    }

    if(b.isbn){
      html += '<div class="color-section-title">ISBN</div>';
      html += `<p class="stats-empty" style="margin:0;">${escapeHtml(b.isbn)}</p>`;
    }

    if(b.rating){
      html += '<div class="color-section-title">Your Rating</div>';
      const stars = [1,2,3,4,5].map(i => `<span class="star-static ${i<=(b.rating||0)?'filled':''}">★</span>`).join('');
      html += `<div class="stars-row">${stars}</div>`;
    }

    if((b.tags||[]).length){
      html += '<div class="color-section-title">Genre</div>';
      html += '<div class="detail-pills">' + b.tags.map(t=>`<span class="tag-pill-mini" style="${tagStyle(t)}">${escapeHtml(t)}</span>`).join('') + '</div>';
    }

    if((b.collections||[]).length){
      html += '<div class="color-section-title">Series</div>';
      html += '<div class="detail-pills">' + b.collections.map(c=>`<span class="tag-pill-mini" style="${collectionStyle(c)}">${escapeHtml(c)}</span>`).join('') + '</div>';
    }

    if(b.notes){
      html += '<div class="color-section-title">Notes</div>';
      html += `<div class="detail-notes">${escapeHtml(b.notes)}</div>`;
    }

    if(b.acquiredDate){
      html += '<div class="color-section-title">Acquired</div>';
      html += `<p class="stats-empty" style="margin:0;">${escapeHtml(b.acquiredDate)}</p>`;
    }

    $('bookDetailContent').innerHTML = html;
  }
  function openBookDetailModal(id){
    const b = books.find(x=>x.id===id);
    if(!b) return;
    renderBookDetail(b);
    $('bookDetailEditBtn').dataset.id = id;
    $('bookDetailOverlay').classList.add('open');
  }
  $('bookDetailCloseBtn').addEventListener('click', ()=> $('bookDetailOverlay').classList.remove('open'));
  $('closeBookDetailBtn').addEventListener('click', ()=> $('bookDetailOverlay').classList.remove('open'));
  $('bookDetailOverlay').addEventListener('click', e=>{ if(e.target === $('bookDetailOverlay')) $('bookDetailOverlay').classList.remove('open'); });
  $('bookDetailEditBtn').addEventListener('click', ()=>{
    const id = $('bookDetailEditBtn').dataset.id;
    $('bookDetailOverlay').classList.remove('open');
    openBookEditModal(id);
  });

  $('authBtn').addEventListener('click', async ()=>{
    $('menuDropdown').classList.remove('open');
    if(!fbAuth) return;
    if(fbUser){ fbAuth.signOut(); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    try{
      await fbAuth.signInWithPopup(provider);
    }catch(e){
      // popups can be blocked in installed/standalone mode — fall back to full-page redirect
      try{ await fbAuth.signInWithRedirect(provider); }
      catch(e2){ showToast('Sign-in failed', true); }
    }
  });

  $('clearAllBtn').addEventListener('click', ()=>{
    $('menuDropdown').classList.remove('open');
    const isBooks = currentMode === 'books';
    const noun = isBooks ? 'book collection' : 'movie collection';
    askConfirm('Clear everything?', `This deletes your entire ${noun} ` + (cloudOn() ? 'from all synced devices.' : 'from this device.') + ' This cannot be undone.', async ()=>{
      if(isBooks){
        if(cloudOn()){
          const ids = books.map(b=>b.id);
          for(let i=0; i<ids.length; i+=450){
            const batch = fbDb.batch();
            ids.slice(i, i+450).forEach(id=> batch.delete(bookCol().doc(id)));
            batch.commit().catch(()=> setSyncState('error'));
          }
          localStorage.removeItem(BOOKS_STORAGE_KEY);
          return;
        }
        books = [];
        render();
        await saveBooks();
        return;
      }
      if(cloudOn()){
        const ids = movies.map(m=>m.id);
        for(let i=0; i<ids.length; i+=450){
          const batch = fbDb.batch();
          ids.slice(i, i+450).forEach(id=> batch.delete(userCol().doc(id)));
          batch.commit().catch(()=> setSyncState('error'));
        }
        localStorage.removeItem(STORAGE_KEY);
        return;
      }
      movies = [];
      render();
      await saveMovies();
    });
  });

  // ---------- Cross-device sync on focus ----------
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && !$('modalOverlay').classList.contains('open') && !$('bookModalOverlay').classList.contains('open')){
      loadMovies();
      loadBooks();
    }
  });
  window.addEventListener('focus', ()=>{
    if(!$('modalOverlay').classList.contains('open') && !$('bookModalOverlay').classList.contains('open')){
      loadMovies();
      loadBooks();
    }
  });

  // ---------- Init ----------
  updateAuthUI();
  if(FIREBASE_CONFIG && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // offline cache; fails harmlessly if unsupported
    fbAuth.onAuthStateChanged(async user=>{
      if(user && user.uid !== OWNER_UID){
        fbAuth.signOut(); // fires this handler again with user = null
        showToast('This app is private', true);
        return;
      }
      fbUser = user;
      updateAuthUI();
      if(unsubMovies){ unsubMovies(); unsubMovies = null; }
      if(unsubBooks){ unsubBooks(); unsubBooks = null; }
      if(user){
        setSyncState('syncing');
        await firstSyncMerge();
        await firstSyncMergeBooks();
        subscribeMovies();
        subscribeBooks();
      } else {
        setSyncState('ok');
        loadMovies();
        loadBooks();
      }
    });
  } else {
    loadMovies();
    loadBooks();
  }
})();
</script>
</body>
</html>
